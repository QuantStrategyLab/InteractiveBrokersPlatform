version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    actions-minor-and-patch:
      patterns:
        - "*"
  open-pull-requests-limit: 3
  commit-message:
    prefix: chore
    include: scope
  ignore:
  - dependency-name: QuantStrategyLab/QuantRuntimeSettings/actions/publish-runtime-execution-evidence
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope

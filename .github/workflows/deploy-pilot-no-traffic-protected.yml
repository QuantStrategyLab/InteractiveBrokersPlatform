name: Deploy IBKR pilot without traffic (protected execution)

on:
  workflow_call:
    inputs:
      isolated_job_network_preflight:
        type: boolean
        required: false
        default: false
      isolated_cleanup_run_id:
        type: string
        required: false
        default: ""
      isolated_network_preflight:
        type: boolean
        required: false
        default: false
      profile:
        type: string
        required: true
      source_commit:
        type: string
        required: true
    secrets:
      DEPLOY_GATE:
        required: true
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT:
        required: true
      CLOUD_RUN_REGION:
        required: true
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: true
      GCP_ARTIFACT_REGISTRY_HOSTNAME:
        required: false
      IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.isolated_network_preflight || inputs.isolated_job_network_preflight) && 15 || 25 }}
    env:
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Checkout trusted release helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install frozen release dependencies
        run: uv sync --frozen --no-dev
      - name: Validate the single private target before authentication
        env: &private_context
          PILOT_DEPLOY_GATE: ${{ secrets.DEPLOY_GATE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
          GCP_ARTIFACT_REGISTRY_HOSTNAME: ${{ secrets.GCP_ARTIFACT_REGISTRY_HOSTNAME }}
          IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS: ${{ secrets.IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS }}
          PILOT_PROFILE: ${{ inputs.profile }}
          PILOT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PILOT_CLEANUP_RUN_ID: ${{ inputs.isolated_cleanup_run_id }}
          PILOT_JOB_NETWORK_PREFLIGHT: ${{ inputs.isolated_job_network_preflight }}
        run: |
          if [ "$PILOT_JOB_NETWORK_PREFLIGHT" = true ] && { [ "${{ inputs.isolated_network_preflight }}" = true ] || [ -n "$PILOT_CLEANUP_RUN_ID" ]; }; then
            echo 'job_mode_invalid=true'; exit 1
          fi
          if [ -n "$PILOT_CLEANUP_RUN_ID" ] && [ "${{ inputs.isolated_network_preflight }}" != true ]; then
            echo 'cleanup_mode_invalid=true'; exit 1
          fi
          uv run --no-sync python -m scripts.deploy_pilot_no_traffic --preflight --bootstrap-identity --receipt "${RUNNER_TEMP}/pilot-release.safe.json"
      - name: Checkout exact application source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Authenticate through the original deployment identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.PILOT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Build and publish one image without traffic
        if: ${{ !inputs.isolated_network_preflight && !inputs.isolated_job_network_preflight }}
        env: *private_context
        run: uv run --no-sync python -m scripts.deploy_pilot_no_traffic --source-dir source --receipt "${RUNNER_TEMP}/pilot-release.safe.json"
      - name: Test the original cloud network without application or broker code
        if: inputs.isolated_network_preflight
        env: *private_context
        run: uv run --no-sync python -m scripts.run_pilot_cloud_tcp --receipt "${RUNNER_TEMP}/pilot-release.safe.json"
      - name: Test the original network in one temporary Job
        if: inputs.isolated_job_network_preflight
        env: *private_context
        run: uv run --no-sync python -m scripts.run_pilot_job_tcp --receipt "${RUNNER_TEMP}/pilot-release.safe.json"
      - name: Retain the fixed safe receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ibkr-pilot-no-traffic-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-release.safe.json
          if-no-files-found: warn
          retention-days: 30

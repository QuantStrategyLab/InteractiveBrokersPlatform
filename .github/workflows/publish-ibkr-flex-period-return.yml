name: Publish IBKR Flex Native Period Return

on:
  # Activity Flex covers completed days. Tue-Sat UTC includes Friday after close,
  # unlike a Mon-Fri evening run which can miss the final session of the week.
  schedule:
    - cron: "40 12 * * 2-6"
  workflow_dispatch:
    inputs:
      publish_once:
        description: "One configured Flex generation, bounded collection of the same pending handle, and one QRS publish."
        type: boolean
        required: false
        default: false
      report_date:
        description: "Optional one historical native daily return (YYYY-MM-DD), within the last 365 days. No trading or query template change."
        type: string
        required: false
        default: ""
      external_flow_only:
        description: "Publish only native date-level external flow facts from the original query."
        type: boolean
        required: false
        default: false
      flow_period_from:
        description: "Optional flow-only historical start (YYYY-MM-DD), pair with end; at most 31 days."
        type: string
        required: false
        default: ""
      flow_period_to:
        description: "Optional flow-only historical end (YYYY-MM-DD)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ibkr-flex-period-return
  cancel-in-progress: false

env:
  QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}

jobs:
  publish:
    # A rerun would generate a new reference. Pending/unknown outcomes require
    # investigation, not a rerun or a fresh dispatch to replace the request.
    if: ${{ github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && inputs.publish_once && vars.IBKR_PERIOD_RETURN_PUBLISH_ENABLED == 'true') || (github.event_name == 'schedule' && vars.IBKR_PERIOD_RETURN_AUTO_SYNC_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require infrastructure variables
        env:
          QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in QSL_CONSOLE_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout approved main source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Generate, collect and publish once
        run: |
          publisher_args=()
          if [ "$EXTERNAL_FLOW_ONLY" = "true" ]; then
            publisher_args=(--cashflow-only)
          else
            if [ -n "$IBKR_FLOW_PERIOD_FROM$IBKR_FLOW_PERIOD_TO" ]; then
              echo "flow_period_requires_flow_only" >&2
              exit 2
            fi
          fi
          uv run --no-sync python -m scripts.publish_ibkr_flex_period_return "${publisher_args[@]}"
        env:
          IBKR_PERIOD_RETURN_PUBLISH_ENABLED: "true"
          EXTERNAL_FLOW_ONLY: ${{ inputs.external_flow_only }}
          IBKR_FLOW_PERIOD_FROM: ${{ inputs.flow_period_from }}
          IBKR_FLOW_PERIOD_TO: ${{ inputs.flow_period_to }}
          IBKR_NATIVE_RETURN_DATE: ${{ inputs.report_date }}
          IBKR_PERIOD_RETURN_TARGET_ID: ${{ secrets.IBKR_PERIOD_RETURN_TARGET_ID }}
          IBKR_PERIOD_RETURN_SOURCE_BINDING_ID: ${{ secrets.IBKR_PERIOD_RETURN_SOURCE_BINDING_ID }}
          IBKR_PERIOD_RETURN_ACCOUNT_SCOPE: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_SCOPE }}
          IBKR_PERIOD_RETURN_ACCOUNT_KEY: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_KEY }}
          IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
          IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
          IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.IBKR_ACCOUNT_FACTS_SYNC_TOKEN }}

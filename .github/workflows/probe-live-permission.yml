name: Probe IBKR Live API Permission

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Disabled live target whose what-if API access will be checked once."
        required: true
        type: choice
        options:
          - tqqq_growth_income
          - soxl_soxx_trend_income
          - global_etf_rotation
          - russell_top50_leader_rotation

permissions:
  contents: read
  id-token: write

concurrency:
  group: ibkr-live-permission-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  probe:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/probe-live-permission-protected.yml
    with:
      target: ${{ inputs.target }}
    secrets:
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}

name: Deploy Cloud Run (protected execution)

# Register the original JSON as a workflow secret before any runner step header.
# This masks the passed value, not every extracted field or reserialized variant.
on:
  workflow_call:
    inputs:
      notification_marker_mode:
        type: string
        required: false
      approve_marker_probe:
        type: boolean
        required: false
      notification_only:
        type: boolean
        required: false
      notification_readback_only:
        type: boolean
        required: false
      target:
        type: string
        required: false
      configured_service:
        type: string
        required: false
      runtime_switch_only:
        type: boolean
        required: false
      request_id:
        type: string
        required: false
      source_commit:
        type: string
        required: false
      expected_serving_revision_digest:
        type: string
        required: false
      expected_full_target_digest:
        type: string
        required: false
      expected_service_spec_digest:
        type: string
        required: false
      cloud_run_region:
        type: string
        required: false
      cloud_run_service:
        type: string
        required: false
      account_group:
        type: string
        required: false
      account_group_config_secret_name:
        type: string
        required: false
      deploy_image:
        type: boolean
        required: false
      sync_env:
        type: boolean
        required: false
      approve_traffic_shift:
        type: boolean
        required: false
      approve_scheduler_sync:
        type: boolean
        required: false
    secrets:
      DIGEST_TARGET_BINDINGS_JSON:
        required: false
      IBKR_NOTIFICATION_MARKER_GCS_URI:
        required: false
      DIGEST_OPAQUE_ACCOUNT_UID:
        required: false
      DIGEST_TARGET_ID:
        required: false
      IBKR_DIGEST_OPAQUE_ACCOUNT_UID:
        required: false
      IBKR_DIGEST_TARGET_ID:
        required: false
      CLOUD_RUN_SERVICE:
        required: false
      CLOUD_RUN_SERVICES:
        required: false
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: false
      GLOBAL_TELEGRAM_CHAT_ID:
        required: false
      RUNTIME_TARGET_JSON:
        required: false
      STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD:
        required: false
      STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN:
        required: false
      STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN:
        required: false
      STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN:
        required: false
      TELEGRAM_TOKEN:
        required: false
      TG_TOKEN:
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  STRATEGY_PLUGIN_ALLOWED_SIGNAL_PREFIXES: ${{ vars.STRATEGY_PLUGIN_ALLOWED_SIGNAL_PREFIXES }}
  GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.IBKR_RUNTIME_SERVICE_ACCOUNT }}
  GCP_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.IBKR_SCHEDULER_SERVICE_ACCOUNT }}
  GCP_ARTIFACT_REGISTRY_REPOSITORY: cloud-run-source-deploy
  IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS: ${{ vars.IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS }}

jobs:
  sync-cloud-run-env:
    name: Deploy / Sync Cloud Run
    # Production deployment and environment sync require an explicit operator dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.notification_only != true && inputs.notification_readback_only != true && (inputs.notification_marker_mode == '' || inputs.notification_marker_mode == 'disabled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ENABLE_GITHUB_CLOUD_RUN_DEPLOY: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      ENABLE_GITHUB_ENV_SYNC: ${{ vars.ENABLE_GITHUB_ENV_SYNC }}
      ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION: ${{ vars.ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION }}
      QSL_ENABLE_CLOUD_RUN_AUTOMATION: ${{ vars.QSL_ENABLE_CLOUD_RUN_AUTOMATION }}
      CLOUD_RUN_CLEANUP_ENABLED: ${{ vars.CLOUD_RUN_CLEANUP_ENABLED }}
      WORKFLOW_TARGET: ${{ inputs.target || 'configured' }}
      INPUT_CONFIGURED_SERVICE: ${{ inputs.configured_service }}
      INPUT_RUNTIME_SWITCH_ONLY: ${{ inputs.runtime_switch_only }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
      INPUT_CLOUD_RUN_REGION: ${{ inputs.cloud_run_region }}
      INPUT_CLOUD_RUN_SERVICE: ${{ inputs.cloud_run_service }}
      INPUT_ACCOUNT_GROUP: ${{ inputs.account_group }}
      INPUT_ACCOUNT_GROUP_CONFIG_SECRET_NAME: ${{ inputs.account_group_config_secret_name }}
      INPUT_DEPLOY_IMAGE: ${{ inputs.deploy_image }}
      INPUT_SYNC_ENV: ${{ inputs.sync_env }}
      INPUT_APPROVE_TRAFFIC_SHIFT: ${{ inputs.approve_traffic_shift }}
      INPUT_APPROVE_SCHEDULER_SYNC: ${{ inputs.approve_scheduler_sync }}
      GCP_ARTIFACT_REGISTRY_HOSTNAME: ${{ vars.GCP_ARTIFACT_REGISTRY_HOSTNAME }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICES: ${{ secrets.CLOUD_RUN_SERVICES }}
      # This is the validated non-secret service inventory maintained by the
      # control plane; legacy Secret support is only a migration fallback.
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      CLOUD_RUN_ENV_SYNC_WAIT_FOR_COMMIT: ${{ vars.CLOUD_RUN_ENV_SYNC_WAIT_FOR_COMMIT }}
      CLOUD_SCHEDULER_LOCATION: ${{ vars.CLOUD_SCHEDULER_LOCATION }}
      CLOUD_SCHEDULER_MAIN_TIME: ${{ vars.CLOUD_SCHEDULER_MAIN_TIME }}
      CLOUD_SCHEDULER_PROBE_TIME: ${{ vars.CLOUD_SCHEDULER_PROBE_TIME }}
      CLOUD_SCHEDULER_PRECHECK_TIME: ${{ vars.CLOUD_SCHEDULER_PRECHECK_TIME }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME }}
      # This is validated deployment intent, not credential material. Prefer the
      # control-plane variable while retaining a legacy-secret fallback during migration.
      RUNTIME_TARGET_JSON: ${{ secrets.RUNTIME_TARGET_JSON }}
      ACCOUNT_GROUP: ${{ vars.ACCOUNT_GROUP }}
      IB_ACCOUNT_GROUP_CONFIG_SECRET_NAME: ${{ vars.IB_ACCOUNT_GROUP_CONFIG_SECRET_NAME }}
      IBKR_FEATURE_SNAPSHOT_PATH: ${{ vars.IBKR_FEATURE_SNAPSHOT_PATH }}
      IBKR_FEATURE_SNAPSHOT_MANIFEST_PATH: ${{ vars.IBKR_FEATURE_SNAPSHOT_MANIFEST_PATH }}
      IBKR_FEATURE_SNAPSHOT_FALLBACK_MODE: ${{ vars.IBKR_FEATURE_SNAPSHOT_FALLBACK_MODE }}
      IBKR_FEATURE_SNAPSHOT_FALLBACK_CACHE_DIR: ${{ vars.IBKR_FEATURE_SNAPSHOT_FALLBACK_CACHE_DIR }}
      IBKR_FEATURE_SNAPSHOT_MAX_STALE_DAYS: ${{ vars.IBKR_FEATURE_SNAPSHOT_MAX_STALE_DAYS }}
      IBKR_STRATEGY_CONFIG_PATH: ${{ vars.IBKR_STRATEGY_CONFIG_PATH }}
      IBKR_STRATEGY_PLUGIN_MOUNTS_JSON: ${{ vars.IBKR_STRATEGY_PLUGIN_MOUNTS_JSON }}
      IBKR_RECONCILIATION_OUTPUT_PATH: ${{ vars.IBKR_RECONCILIATION_OUTPUT_PATH }}
      IBKR_DRY_RUN_ONLY: ${{ vars.IBKR_DRY_RUN_ONLY }}
      IBKR_EXECUTION_DEDUP_ENABLED: ${{ vars.IBKR_EXECUTION_DEDUP_ENABLED }}
      IBKR_PAPER_LIQUIDATE_ONLY: ${{ vars.IBKR_PAPER_LIQUIDATE_ONLY }}
      IBKR_FORCE_RUN: ${{ vars.IBKR_FORCE_RUN }}
      IBKR_MARKET: ${{ vars.IBKR_MARKET }}
      IBKR_MARKET_CALENDAR: ${{ vars.IBKR_MARKET_CALENDAR }}
      IBKR_MARKET_CURRENCY: ${{ vars.IBKR_MARKET_CURRENCY }}
      IBKR_MARKET_DATA_SYMBOL_SUFFIX: ${{ vars.IBKR_MARKET_DATA_SYMBOL_SUFFIX }}
      IBKR_MARKET_EXCHANGE: ${{ vars.IBKR_MARKET_EXCHANGE }}
      IBKR_MARKET_TIMEZONE: ${{ vars.IBKR_MARKET_TIMEZONE }}
      IBKR_MIN_RESERVED_CASH_USD: ${{ vars.IBKR_MIN_RESERVED_CASH_USD }}
      IBKR_RESERVED_CASH_RATIO: ${{ vars.IBKR_RESERVED_CASH_RATIO }}
      IBKR_SAFE_HAVEN_CASH_SUBSTITUTE_THRESHOLD_USD: ${{ vars.IBKR_SAFE_HAVEN_CASH_SUBSTITUTE_THRESHOLD_USD }}
      INCOME_LAYER_ENABLED: ${{ vars.INCOME_LAYER_ENABLED }}
      INCOME_LAYER_START_USD: ${{ vars.INCOME_LAYER_START_USD }}
      INCOME_LAYER_MAX_RATIO: ${{ vars.INCOME_LAYER_MAX_RATIO }}
      IBKR_CASH_ONLY_EXECUTION: ${{ vars.IBKR_CASH_ONLY_EXECUTION }}
      CASH_ONLY_EXECUTION: ${{ vars.CASH_ONLY_EXECUTION }}
      DCA_MODE: ${{ vars.DCA_MODE }}
      DCA_BASE_INVESTMENT_USD: ${{ vars.DCA_BASE_INVESTMENT_USD }}
      IBIT_ZSCORE_EXIT_ENABLED: ${{ vars.IBIT_ZSCORE_EXIT_ENABLED }}
      IBIT_ZSCORE_EXIT_MODE: ${{ vars.IBIT_ZSCORE_EXIT_MODE }}
      IBIT_ZSCORE_EXIT_PARKING_SYMBOL: ${{ vars.IBIT_ZSCORE_EXIT_PARKING_SYMBOL }}
      IBIT_ZSCORE_EXIT_RISK_REDUCED_EXPOSURE: ${{ vars.IBIT_ZSCORE_EXIT_RISK_REDUCED_EXPOSURE }}
      IBIT_ZSCORE_EXIT_RISK_OFF_EXPOSURE: ${{ vars.IBIT_ZSCORE_EXIT_RISK_OFF_EXPOSURE }}
      IBIT_ZSCORE_EXIT_ALLOW_OUTSIDE_EXECUTION_WINDOW: ${{ vars.IBIT_ZSCORE_EXIT_ALLOW_OUTSIDE_EXECUTION_WINDOW }}
      IBKR_MARKET_SIGNAL_HANDOFF_INDEX_URI: ${{ vars.IBKR_MARKET_SIGNAL_HANDOFF_INDEX_URI }}
      IBKR_MARKET_SIGNAL_HANDOFF_MANIFEST_URI: ${{ vars.IBKR_MARKET_SIGNAL_HANDOFF_MANIFEST_URI }}
      IBKR_MARKET_SIGNAL_CONSUMPTION_AUDIT_URI: ${{ vars.IBKR_MARKET_SIGNAL_CONSUMPTION_AUDIT_URI }}
      IBKR_MARKET_SIGNAL_CACHE_DIR: ${{ vars.IBKR_MARKET_SIGNAL_CACHE_DIR }}
      IBKR_MARKET_SIGNAL_REQUIRED: ${{ vars.IBKR_MARKET_SIGNAL_REQUIRED }}
      IBKR_MARKET_SIGNAL_FALLBACK_MODE: ${{ vars.IBKR_MARKET_SIGNAL_FALLBACK_MODE }}
      IBKR_MARKET_SIGNAL_MAX_STALE_DAYS: ${{ vars.IBKR_MARKET_SIGNAL_MAX_STALE_DAYS }}
      STRATEGY_PLUGIN_ALERT_CHANNELS: ${{ vars.STRATEGY_PLUGIN_ALERT_CHANNELS }}
      STRATEGY_PLUGIN_ALERT_EMAIL_RECIPIENTS: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_RECIPIENTS }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_EMAIL: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_EMAIL }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD_SECRET_NAME: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD_SECRET_NAME }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_HOST: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_HOST }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_PORT: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_PORT }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_SECURITY: ${{ vars.STRATEGY_PLUGIN_ALERT_EMAIL_SMTP_SECURITY }}
      STRATEGY_PLUGIN_ALERT_SMS_RECIPIENTS: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_RECIPIENTS }}
      STRATEGY_PLUGIN_ALERT_SMS_PROVIDER: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_PROVIDER }}
      STRATEGY_PLUGIN_ALERT_SMS_ACCOUNT_ID: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_ACCOUNT_ID }}
      STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN_SECRET_NAME: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN_SECRET_NAME }}
      STRATEGY_PLUGIN_ALERT_SMS_SENDER: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_SENDER }}
      STRATEGY_PLUGIN_ALERT_SMS_MESSAGING_SERVICE_ID: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_MESSAGING_SERVICE_ID }}
      STRATEGY_PLUGIN_ALERT_SMS_API_BASE_URL: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_API_BASE_URL }}
      STRATEGY_PLUGIN_ALERT_SMS_BODY_MAX_CHARS: ${{ vars.STRATEGY_PLUGIN_ALERT_SMS_BODY_MAX_CHARS }}
      STRATEGY_PLUGIN_ALERT_PUSH_RECIPIENTS: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_RECIPIENTS }}
      STRATEGY_PLUGIN_ALERT_PUSH_PROVIDER: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_PROVIDER }}
      STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN_SECRET_NAME: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN_SECRET_NAME }}
      STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN_SECRET_NAME: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN_SECRET_NAME }}
      STRATEGY_PLUGIN_ALERT_PUSH_API_BASE_URL: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_API_BASE_URL }}
      STRATEGY_PLUGIN_ALERT_PUSH_DEVICE: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_DEVICE }}
      STRATEGY_PLUGIN_ALERT_PUSH_PRIORITY: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_PRIORITY }}
      STRATEGY_PLUGIN_ALERT_PUSH_TAGS: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_TAGS }}
      STRATEGY_PLUGIN_ALERT_PUSH_BODY_MAX_CHARS: ${{ vars.STRATEGY_PLUGIN_ALERT_PUSH_BODY_MAX_CHARS }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_CHAT_IDS: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_CHAT_IDS }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_BOT_TOKEN_SECRET_NAME: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_BOT_TOKEN_SECRET_NAME }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_API_BASE_URL: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_API_BASE_URL }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_PARSE_MODE: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_PARSE_MODE }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_BODY_MAX_CHARS: ${{ vars.STRATEGY_PLUGIN_ALERT_TELEGRAM_BODY_MAX_CHARS }}
      # Strategy-owned defaults continue to come from UsEquityStrategies; this workflow only syncs platform/runtime inputs.
      EXECUTION_REPORT_GCS_URI: ${{ vars.EXECUTION_REPORT_GCS_URI }}
      # Empty by default. When explicitly set, the workflow downloads one
      # immutable, private recovery ledger before deriving its sync plan.
      IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI: ${{ vars.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD: ${{ secrets.STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD }}
      STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN }}
      STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN }}
      STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN }}
      STRATEGY_PLUGIN_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_RUNTIME_SERVICE_ACCOUNT: ${{ vars.IBKR_RUNTIME_SERVICE_ACCOUNT }}
          IBKR_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.IBKR_SCHEDULER_SERVICE_ACCOUNT }}
          STRATEGY_PLUGIN_ALLOWED_SIGNAL_PREFIXES: ${{ vars.STRATEGY_PLUGIN_ALLOWED_SIGNAL_PREFIXES }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID IBKR_RUNTIME_SERVICE_ACCOUNT IBKR_SCHEDULER_SERVICE_ACCOUNT STRATEGY_PLUGIN_ALLOWED_SIGNAL_PREFIXES; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Check whether Cloud Run automation is enabled
        id: config
        run: |
          set -euo pipefail

          write_github_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }

          deploy_enabled=false
          env_sync_enabled=false
          traffic_shift_enabled=false
          scheduler_sync_enabled=false

          # QSL_ENABLE_CLOUD_RUN_AUTOMATION overrides ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION
          ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION="${QSL_ENABLE_CLOUD_RUN_AUTOMATION:-$ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION}"
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION:-}" != "true" ]; then
            write_github_output \
              "deploy_enabled=false" \
              "env_sync_enabled=false" \
              "traffic_shift_enabled=false" \
              "scheduler_sync_enabled=false" \
              "enabled=false"
            echo "Skipping Cloud Run automation on push because ENABLE_MAIN_PUSH_CLOUD_RUN_AUTOMATION is not true." >&2
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${WORKFLOW_TARGET:-configured}" = "hk-verify" ]; then
            if [ "${INPUT_DEPLOY_IMAGE:-true}" = "true" ]; then
              deploy_enabled=true
            fi
            if [ "${INPUT_SYNC_ENV:-true}" = "true" ]; then
              env_sync_enabled=true
            fi
          else
            if [ "${ENABLE_GITHUB_CLOUD_RUN_DEPLOY:-}" = "true" ] \
              && { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${INPUT_DEPLOY_IMAGE:-true}" = "true" ]; }; then
              deploy_enabled=true
            fi

            if [ "${ENABLE_GITHUB_ENV_SYNC:-}" = "true" ] \
              && { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${INPUT_SYNC_ENV:-true}" = "true" ]; }; then
              env_sync_enabled=true
            fi
          fi

          if [ "${INPUT_APPROVE_TRAFFIC_SHIFT:-false}" = "true" ]; then
            traffic_shift_enabled=true
          fi
          if [ "${INPUT_APPROVE_SCHEDULER_SYNC:-false}" = "true" ]; then
            scheduler_sync_enabled=true
          fi

          if [ "${INPUT_RUNTIME_SWITCH_ONLY:-false}" = "true" ] && \
             { [ "${WORKFLOW_TARGET:-configured}" != "configured" ] || [ "${deploy_enabled}" = "true" ] || \
               [ "${env_sync_enabled}" != "true" ] || [ "${traffic_shift_enabled}" != "true" ] || \
               [ "${scheduler_sync_enabled}" != "true" ]; }; then
            echo "Runtime switch requires one configured target, no image build, and enabled sync controls." >&2
            exit 1
          fi
          if [ "${INPUT_RUNTIME_SWITCH_ONLY:-false}" = "true" ] && \
             [[ ! "${INPUT_REQUEST_ID:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Runtime switch requires a lowercase UUID request_id." >&2
            exit 1
          fi

          if [ "${WORKFLOW_TARGET:-configured}" = "configured" ] && [ -z "${INPUT_CONFIGURED_SERVICE:-}" ]; then
            if [ "${deploy_enabled}" = "true" ] || [ "${env_sync_enabled}" = "true" ] || [ "${traffic_shift_enabled}" = "true" ] || [ "${scheduler_sync_enabled}" = "true" ]; then
              echo "configured target requires exact configured_service; refusing multi-service default mutations." >&2
              exit 1
            fi
          fi

          if { [ "${deploy_enabled}" = "true" ] || [ "${env_sync_enabled}" = "true" ] || [ "${traffic_shift_enabled}" = "true" ] || [ "${scheduler_sync_enabled}" = "true" ]; } \
            && [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "Cloud Run mutations require the trusted main workflow ref." >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${deploy_enabled}" = "true" ] \
            && [ -n "${INPUT_SOURCE_COMMIT:-}" ] \
            && [[ ! "${INPUT_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Explicit source_commit must be a full 40-character SHA." >&2
            exit 1
          fi

          write_github_output \
            "deploy_enabled=${deploy_enabled}" \
            "env_sync_enabled=${env_sync_enabled}" \
            "traffic_shift_enabled=${traffic_shift_enabled}" \
            "scheduler_sync_enabled=${scheduler_sync_enabled}"

          if [ "${deploy_enabled}" != "true" ] && [ "${env_sync_enabled}" != "true" ] && [ "${traffic_shift_enabled}" != "true" ] && [ "${scheduler_sync_enabled}" != "true" ]; then
            write_github_output "enabled=false"
            echo "Skipping Cloud Run automation because ENABLE_GITHUB_CLOUD_RUN_DEPLOY and ENABLE_GITHUB_ENV_SYNC are not true." >&2
            exit 0
          fi

          write_github_output "enabled=true"

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Checkout selected image source
        if: steps.config.outputs.deploy_enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false

      - name: Verify selected image source
        if: steps.config.outputs.deploy_enabled == 'true'
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_COMMIT:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Selected source must be a full commit SHA." >&2
            exit 1
          fi
          checked_out_sha="$(git -C source rev-parse HEAD)"
          if [ "${checked_out_sha}" != "${SOURCE_COMMIT}" ]; then
            echo "Checked-out image source does not match source_commit." >&2
            exit 1
          fi

      - name: Apply HK verify-only dispatch defaults
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'hk-verify'
        run: |
          set -euo pipefail

          service="${INPUT_CLOUD_RUN_SERVICE:-interactive-brokers-hk-verify-service}"
          account_group="${INPUT_ACCOUNT_GROUP:-hk-verify}"
          region="${INPUT_CLOUD_RUN_REGION:-${CLOUD_RUN_REGION:-}}"
          runtime_target="$(SERVICE="${service}" ACCOUNT_GROUP_VALUE="${account_group}" python3 - <<'PY'
          import json
          import os

          print(
              json.dumps(
                  {
                      "platform_id": "ibkr",
                      "strategy_profile": "hk_global_etf_tactical_rotation",
                      "deployment_selector": os.environ["ACCOUNT_GROUP_VALUE"],
                      "account_scope": os.environ["ACCOUNT_GROUP_VALUE"],
                      "execution_mode": "paper",
                      "dry_run_only": True,
                      "service_name": os.environ["SERVICE"],
                  },
                  separators=(",", ":"),
              )
          )
          PY
          )"

          {
            echo "CLOUD_RUN_SERVICE=${service}"
            echo "CLOUD_RUN_SERVICES="
            echo "CLOUD_RUN_SERVICE_TARGETS_JSON="
            echo "ACCOUNT_GROUP=${account_group}"
            echo "RUNTIME_TARGET_JSON=${runtime_target}"
            echo "IBKR_DRY_RUN_ONLY=true"
            echo "IBKR_MARKET=HK"
            echo "IBKR_MARKET_CALENDAR=XHKG"
            echo "IBKR_MARKET_CURRENCY=HKD"
            echo "IBKR_MARKET_DATA_SYMBOL_SUFFIX=.HK"
            echo "IBKR_MARKET_EXCHANGE=SEHK"
            echo "IBKR_MARKET_TIMEZONE=Asia/Hong_Kong"
          } >> "$GITHUB_ENV"

          if [ -n "${region}" ]; then
            echo "CLOUD_RUN_REGION=${region}" >> "$GITHUB_ENV"
          fi
          if [ -n "${INPUT_ACCOUNT_GROUP_CONFIG_SECRET_NAME:-}" ]; then
            echo "IB_ACCOUNT_GROUP_CONFIG_SECRET_NAME=${INPUT_ACCOUNT_GROUP_CONFIG_SECRET_NAME}" >> "$GITHUB_ENV"
          fi
          if [ "${INPUT_DEPLOY_IMAGE:-true}" != "true" ]; then
            echo "CLOUD_RUN_ENV_SYNC_WAIT_FOR_COMMIT=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Python for runtime target admission
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Fetch opt-in immutable recovery state ledger
        if: steps.config.outputs.enabled == 'true' && inputs.runtime_switch_only != true && env.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI != ''
        env:
          RECOVERY_STATE_LEDGER_URI: ${{ env.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI }}
        run: |
          set -euo pipefail
          case "${RECOVERY_STATE_LEDGER_URI}" in
            gs://qsl-reconciliation-recovery-private-ibkr/reconciliation-recovery/ibkr/state/*.json) ;;
            *)
              echo "Recovery state ledger URI must use the dedicated private immutable prefix." >&2
              exit 1
              ;;
          esac
          recovery_state_ledger_path="${RUNNER_TEMP}/ibkr-reconciliation-recovery-state-ledger.json"
          gcloud storage cp --quiet "${RECOVERY_STATE_LEDGER_URI}" "${recovery_state_ledger_path}" >/dev/null
          chmod 600 "${recovery_state_ledger_path}"
          echo "IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PATH=${recovery_state_ledger_path}" >> "$GITHUB_ENV"

      - name: Install strategy status dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv sync --frozen --no-dev
      - name: Resolve admissible Cloud Run targets
        id: strategy_requirements
        if: steps.config.outputs.enabled == 'true'
        env:
          QSL_ROUTINE_NOTIFICATION_MODE: ${{ vars.QSL_ROUTINE_NOTIFICATION_MODE }}
          QSL_DIGEST_ROUTINE_ORDERS: ${{ vars.QSL_DIGEST_ROUTINE_ORDERS }}
        run: |
          set -euo pipefail
          sync_plan_json="$(uv run --no-sync python scripts/build_cloud_run_env_sync_plan.py --json)"
          export SYNC_PLAN_JSON="${sync_plan_json}"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          selected = os.environ.get("INPUT_CONFIGURED_SERVICE", "")
          if os.environ.get("WORKFLOW_TARGET", "configured") == "configured":
              if not selected:
                  raise SystemExit("configured target requires exact configured_service matching one admitted inventory service_name")
              if not re.fullmatch(r"[a-z][a-z0-9-]{0,62}", selected) or plan.get("mode") != "per_service":
                  raise SystemExit("configured_service requires an exact private inventory service_name")
              matches = [target for target in plan["targets"] if target.get("service_name") == selected]
              if len(matches) != 1:
                  raise SystemExit("configured_service must match exactly one admitted inventory target")
              plan["targets"] = matches
              # Reconciliation also reads inventory and legacy env; scope every source.
              inventory = json.dumps({"targets": [{"service_name": selected}]})
              with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
                  handle.write(f"CLOUD_RUN_SERVICE_TARGETS_JSON={inventory}\n")
                  handle.write(f"CLOUD_RUN_SERVICE={selected}\nCLOUD_RUN_SERVICES={selected}\n")
          # Apply only to the admitted, selected target. Unset keeps the plan intact.
          routine_orders = os.environ.get("QSL_DIGEST_ROUTINE_ORDERS", "").strip()
          if routine_orders and routine_orders not in {"true", "false"}:
              raise SystemExit("QSL_DIGEST_ROUTINE_ORDERS must be true or false")
          if routine_orders:
              for target in plan.get("targets", []):
                  target["env"]["QSL_DIGEST_ROUTINE_ORDERS"] = routine_orders
                  target["remove_env_vars"] = [key for key in target.get("remove_env_vars", []) if key != "QSL_DIGEST_ROUTINE_ORDERS"]
          mode = os.environ.get("QSL_ROUTINE_NOTIFICATION_MODE", "").strip()
          if mode:
              if mode not in {"immediate", "daily_digest"}:
                  raise SystemExit("QSL_ROUTINE_NOTIFICATION_MODE must be immediate or daily_digest")
              for target in plan["targets"]:
                  target["env"]["QSL_ROUTINE_NOTIFICATION_MODE"] = mode
                  target["remove_env_vars"] = [key for key in target.get("remove_env_vars", []) if key != "QSL_ROUTINE_NOTIFICATION_MODE"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write("sync_plan_json<<__SYNC_PLAN_JSON__\n")
              handle.write(json.dumps(plan) + "\n__SYNC_PLAN_JSON__\n")
          PY

      - name: Validate env sync inputs
        if: steps.config.outputs.env_sync_enabled == 'true' && inputs.runtime_switch_only != true
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail

          required_vars=(
            CLOUD_RUN_REGION
          )

          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              missing_vars+=("${var_name}")
            fi
          done

          if [ -z "${TELEGRAM_TOKEN_SECRET_NAME:-}" ] && [ -z "${TELEGRAM_TOKEN:-}" ]; then
            missing_vars+=("TELEGRAM_TOKEN_SECRET_NAME or TELEGRAM_TOKEN")
          fi

          python - <<'PY'
          import json
          import os
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          targets = plan.get("targets") or []
          if not targets:
              raise SystemExit("Cloud Run env sync did not resolve any targets")
          for target in targets:
              service_name = str(target.get("service_name") or "").strip()
              if not service_name:
                  raise SystemExit("Cloud Run sync target is missing service_name")
              if not isinstance(target.get("env"), dict):
                  raise SystemExit(f"Cloud Run sync target {service_name} is missing env")
          PY

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "Cloud Run env sync is enabled, but these values are missing:" >&2
            printf '  - %s\n' "${missing_vars[@]}" >&2
            exit 1
          fi

      - name: Validate deploy inputs
        if: steps.config.outputs.deploy_enabled == 'true'
        run: |
          set -euo pipefail

          if [ -z "${CLOUD_RUN_REGION:-}" ]; then
            echo "Cloud Run deploy is enabled, but CLOUD_RUN_REGION is missing." >&2
            exit 1
          fi

          mapfile -t target_services < <(python - <<'PY'
          import json
          import os

          raw_targets = os.environ.get("CLOUD_RUN_SERVICE_TARGETS_JSON", "").strip()
          if raw_targets:
              payload = json.loads(raw_targets)
              entries = payload.get("targets") if isinstance(payload, dict) else payload
              if not isinstance(entries, list):
                  raise SystemExit("CLOUD_RUN_SERVICE_TARGETS_JSON must be a JSON array or an object with targets")
              for entry in entries:
                  if not isinstance(entry, dict):
                      raise SystemExit("Each Cloud Run deploy target must be an object")
                  service = (
                      entry.get("service")
                      or entry.get("service_name")
                      or entry.get("cloud_run_service")
                  )
                  runtime_target = entry.get("runtime_target") or entry.get("runtime_target_json")
                  if not service and isinstance(runtime_target, str):
                      runtime_target = json.loads(runtime_target)
                  if not service and isinstance(runtime_target, dict):
                      service = runtime_target.get("service_name")
                  service = str(service or "").strip()
                  if service:
                      print(service)
              raise SystemExit(0)

          raw_services = os.environ.get("CLOUD_RUN_SERVICES", "").strip() or os.environ.get("CLOUD_RUN_SERVICE", "").strip()
          for chunk in raw_services.replace(";", ",").replace("\n", ",").split(","):
              service = chunk.strip()
              if service:
                  print(service)
          PY
          )

          if [ "${#target_services[@]}" -eq 0 ]; then
            echo "Cloud Run deploy is enabled, but no services were found in CLOUD_RUN_SERVICE_TARGETS_JSON, CLOUD_RUN_SERVICES, or CLOUD_RUN_SERVICE." >&2
            exit 1
          fi

      - name: Require configured scheduler migration before HK verify
        if: steps.config.outputs.env_sync_enabled == 'true' && env.WORKFLOW_TARGET == 'hk-verify'
        run: |
          set -euo pipefail
          scheduler_location="${CLOUD_SCHEDULER_LOCATION:-${CLOUD_RUN_REGION}}"
          if gcloud scheduler jobs describe "interactive-brokers-monitor-dispatcher-scheduler" \
            --project="${GCP_PROJECT_ID}" \
            --location="${scheduler_location}" >/dev/null 2>&1; then
            echo "HK verify scheduler migration requires the configured migration first." >&2
            exit 1
          fi

      - name: Capture no-traffic deployment baseline
        if: steps.config.outputs.deploy_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
          DEPLOY_READBACK_DIR: ${{ runner.temp }}/cloud-run-no-traffic-baseline
        run: |
          set -euo pipefail
          mkdir -p "${DEPLOY_READBACK_DIR}"
          mapfile -t target_services < <(python - <<'PY'
          import json
          import os
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          for target in plan["targets"]:
              print(target["service_name"])
          PY
          )
          if [ "${#target_services[@]}" -eq 0 ]; then
            echo "Cloud Run deploy did not resolve any targets." >&2
            exit 1
          fi
          for cloud_run_service in "${target_services[@]}"; do
            python3 scripts/verify_cloud_run_no_traffic_deploy.py capture \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --service="${cloud_run_service}" \
              --scheduler-location="${CLOUD_SCHEDULER_LOCATION:-${CLOUD_RUN_REGION}}" \
              --output="${DEPLOY_READBACK_DIR}/${cloud_run_service}.json"
          done

      - name: Verify deployed runtime target admission before traffic shift
        if: steps.config.outputs.deploy_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/verify_deployed_runtime_target_admission.py \
            --project="${GCP_PROJECT_ID}" \
            --region="${CLOUD_RUN_REGION}"

      - name: Build, push, and deploy Cloud Run image
        id: deploy
        if: steps.config.outputs.deploy_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail

          mapfile -t target_services < <(python - <<'PY'
          import json
          import os

          raw_plan = os.environ.get("SYNC_PLAN_JSON", "").strip()
          if raw_plan:
              plan = json.loads(raw_plan)
              for target in plan["targets"]:
                  service = str(target.get("service_name") or "").strip()
                  if service:
                      print(service)
              raise SystemExit(0)

          raw_targets = os.environ.get("CLOUD_RUN_SERVICE_TARGETS_JSON", "").strip()
          if raw_targets:
              payload = json.loads(raw_targets)
              entries = payload.get("targets") if isinstance(payload, dict) else payload
              for entry in entries:
                  service = (
                      entry.get("service")
                      or entry.get("service_name")
                      or entry.get("cloud_run_service")
                  )
                  runtime_target = entry.get("runtime_target") or entry.get("runtime_target_json")
                  if not service and isinstance(runtime_target, str):
                      runtime_target = json.loads(runtime_target)
                  if not service and isinstance(runtime_target, dict):
                      service = runtime_target.get("service_name")
                  service = str(service or "").strip()
                  if service:
                      print(service)
              raise SystemExit(0)

          raw_services = os.environ.get("CLOUD_RUN_SERVICES", "").strip() or os.environ.get("CLOUD_RUN_SERVICE", "").strip()
          for chunk in raw_services.replace(";", ",").replace("\n", ",").split(","):
              service = chunk.strip()
              if service:
                  print(service)
          PY
          )
          if [ "${#target_services[@]}" -eq 0 ]; then
            echo "Cloud Run deploy did not resolve any targets." >&2
            exit 1
          fi

          artifact_registry_hostname="${GCP_ARTIFACT_REGISTRY_HOSTNAME:-${CLOUD_RUN_REGION}-docker.pkg.dev}"
          image_repo="${artifact_registry_hostname}/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/interactivebrokersplatform/cloud-run"
          image="${image_repo}:${SOURCE_COMMIT}-${GITHUB_RUN_ID}"

          gcloud auth configure-docker "${artifact_registry_hostname}" --quiet
          docker build --pull -t "${image}" source
          # RS-08 guard: block the deploy if the image's installed UES revision differs from
          # strategy_release / runtime-risk binding (live would reject every SOXL rebalance).
          python3 scripts/verify_image_ues_release_binding.py --image "${image}" --lockfile source/uv.lock --report-json "${RUNNER_TEMP}/ues-binding-coverage.json"
          docker push "${image}"
          image_digest="$(gcloud artifacts docker images describe "${image}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registry did not return a valid image digest." >&2
            exit 1
          fi
          immutable_image="${image_repo}@${image_digest}"
          # Protect all existing service/Job references, this candidate, and any
          # explicitly designated rollback digests before changing Cloud Run.
          IFS=',' read -r -a rollback_digests <<< "${IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS:-}"
          rollback_args=()
          for digest in "${rollback_digests[@]}"; do
            if [ -n "${digest}" ]; then
              rollback_args+=(--rollback-digest "${digest}")
            fi
          done
          python3 scripts/refresh_artifact_registry_keep.py \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --repository "${GCP_ARTIFACT_REGISTRY_REPOSITORY}" \
            --image-repo "${image_repo}" \
            --candidate "${immutable_image}" \
            "${rollback_args[@]}"
          echo "image_digest=${image_digest}" >> "${GITHUB_OUTPUT}"

          for cloud_run_service in "${target_services[@]}"; do
            gcloud run deploy "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --platform=managed \
              --image="${immutable_image}" \
              --service-account="${GCP_RUNTIME_SERVICE_ACCOUNT}" \
              --no-allow-unauthenticated \
              --ingress=internal \
              --max-instances=1 \
              --concurrency=1 \
              --memory=512Mi \
              --cpu=1 \
              --timeout=300s \
              --network=default \
              --subnet=default \
              --vpc-egress=private-ranges-only \
              --labels="managed-by=github-actions,commit-sha=${SOURCE_COMMIT},github-run-id=${GITHUB_RUN_ID}" \
              --no-traffic \
              --deploy-health-check \
              --startup-probe="httpGet.path=/health,httpGet.port=8080,periodSeconds=10,timeoutSeconds=5,failureThreshold=24" \
              --quiet
          done

      - name: Summarize build-time UES binding coverage
        continue-on-error: true
        if: always() && steps.config.outputs.deploy_enabled == 'true'
        run: |
          python3 scripts/verify_image_ues_release_binding.py --summarize-report "${RUNNER_TEMP}/ues-binding-coverage.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify no-traffic deployment readback
        if: steps.config.outputs.deploy_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
          DEPLOY_READBACK_DIR: ${{ runner.temp }}/cloud-run-no-traffic-baseline
          EXPECTED_IMAGE_DIGEST: ${{ steps.deploy.outputs.image_digest }}
        run: |
          set -euo pipefail
          mapfile -t target_services < <(python - <<'PY'
          import json
          import os
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          for target in plan["targets"]:
              print(target["service_name"])
          PY
          )
          for cloud_run_service in "${target_services[@]}"; do
            python3 scripts/verify_cloud_run_no_traffic_deploy.py verify \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --service="${cloud_run_service}" \
              --scheduler-location="${CLOUD_SCHEDULER_LOCATION:-${CLOUD_RUN_REGION}}" \
              --before="${DEPLOY_READBACK_DIR}/${cloud_run_service}.json" \
              --expected-sha="${SOURCE_COMMIT}" \
              --expected-image-digest="${EXPECTED_IMAGE_DIGEST}"
          done

      - name: Wait for Cloud Run deployment of current commit
        if: steps.config.outputs.deploy_enabled == 'true' && steps.config.outputs.env_sync_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail

          mapfile -t target_services < <(python - <<'PY'
          import json
          import os
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          for target in plan["targets"]:
              print(target["service_name"])
          PY
          )
          if [ "${#target_services[@]}" -eq 0 ]; then
            echo "Cloud Run env sync did not resolve any targets." >&2
            exit 1
          fi

          case "${CLOUD_RUN_ENV_SYNC_WAIT_FOR_COMMIT:-true}" in
            false|False|FALSE|0|no|No|NO|off|Off|OFF)
              echo "Skipping Cloud Run commit wait because CLOUD_RUN_ENV_SYNC_WAIT_FOR_COMMIT is disabled."
              exit 0
              ;;
          esac

          target_sha="${SOURCE_COMMIT}"

          for cloud_run_service in "${target_services[@]}"; do
            deadline=$((SECONDS + 1800))

            while true; do
              deployed_sha="$(gcloud run services describe "${cloud_run_service}" --region "${CLOUD_RUN_REGION}" --format='value(spec.template.metadata.labels.commit-sha)' 2>/dev/null || true)"
              if [ -n "${deployed_sha}" ] && [ "${deployed_sha}" = "${target_sha}" ]; then
                echo "Cloud Run service ${cloud_run_service} is on commit ${deployed_sha}."
                break
              fi

              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "Timed out waiting for Cloud Run service ${cloud_run_service} to deploy commit ${target_sha}. Last seen commit: ${deployed_sha:-<none>}" >&2
                exit 1
              fi

              echo "Waiting for Cloud Run service ${cloud_run_service} to deploy commit ${target_sha}. Last seen commit: ${deployed_sha:-<none>}" >&2
              sleep 10
            done
          done

      - name: Prepare env-only revision and runtime switch
        if: steps.config.outputs.env_sync_enabled == 'true' && steps.config.outputs.deploy_enabled != 'true' && steps.config.outputs.traffic_shift_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
          EXACT_ENV_TRAFFIC: ${{ steps.config.outputs.deploy_enabled != 'true' && steps.config.outputs.traffic_shift_enabled == 'true' }}
          RUNTIME_SWITCH_ONLY: ${{ inputs.runtime_switch_only }}
        run: |
          set -euo pipefail

          mapfile -t target_services < <(python - <<'PY'
          import json
          import os
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          for target in plan["targets"]:
              print(target["service_name"])
          PY
          )
          if [ "${#target_services[@]}" -eq 0 ]; then
            echo "Cloud Run env sync did not resolve any targets." >&2
            exit 1
          fi
          if [ "${EXACT_ENV_TRAFFIC}" = "true" ]; then
            if [ "${#target_services[@]}" -ne 1 ]; then
              echo "Env-only traffic requires one target." >&2
              exit 1
            fi
            umask 077
            evidence_dir="${RUNNER_TEMP}/ibkr-env-sync-evidence"
            mkdir "${evidence_dir}"
            cloud_run_service="${target_services[0]}"
            gcloud run services describe "${cloud_run_service}" --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" --format=json > "${evidence_dir}/baseline-service.json"
            baseline_revision="$(python - "${evidence_dir}/baseline-service.json" <<'PY'
          import json, sys
          service = json.load(open(sys.argv[1], encoding="utf-8"))
          traffic = [row for row in service.get("status", {}).get("traffic", []) if row.get("percent", 0) > 0]
          if len(traffic) != 1 or traffic[0].get("percent") != 100 or not traffic[0].get("revisionName"):
              raise SystemExit("Env-only traffic requires one serving revision.")
          print(traffic[0]["revisionName"])
          PY
            )"
            gcloud run revisions describe "${baseline_revision}" --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" --format=json > "${evidence_dir}/baseline-revision.json"
            revision_suffix="e$(printf '%x' "${GITHUB_RUN_ID}")-${GITHUB_RUN_ATTEMPT}"
            candidate_revision="${cloud_run_service}-${revision_suffix}"
            if [ "${#candidate_revision}" -gt 63 ]; then
              echo "Env-only candidate revision name is too long." >&2
              exit 1
            fi
            printf '%s' "${candidate_revision}" > "${evidence_dir}/candidate-revision.txt"
            echo "IBKR_ENV_SYNC_EVIDENCE_DIR=${evidence_dir}" >> "$GITHUB_ENV"
            echo "IBKR_ENV_SYNC_REVISION_SUFFIX=${revision_suffix}" >> "$GITHUB_ENV"
          fi

          if [ "${RUNTIME_SWITCH_ONLY:-false}" = "true" ]; then
            switch_result="$(uv run --no-sync python - "${evidence_dir}/baseline-revision.json" <<'PY'
          import json, os, sys
          from scripts.reconcile_cloud_runtime import validate_switch_baseline
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          desired, unchanged = validate_switch_baseline(json.load(open(sys.argv[1], encoding="utf-8")), plan["targets"][0])
          print(desired, str(unchanged).lower())
          PY
            )"
            read -r desired_switch switch_unchanged <<< "${switch_result}"
            python - "${desired_switch}" "${evidence_dir}/baseline-revision.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])["targets"][0]
          revision = json.load(open(sys.argv[2], encoding="utf-8"))
          rows = revision.get("spec", {}).get("containers", [{}])[0].get("env", [])
          target = json.loads(next((row.get("value") for row in rows if row.get("name") == "RUNTIME_TARGET_JSON"), "{}"))
          continuity = target.get("live_continuity", {}).get("state")
          if continuity not in {"ACTIVE_LKG", "ACTIVE_REDUCED", "RECONCILE_ONLY", "RISK_REDUCTION_ONLY", "PAUSED", "ROLLBACK_LKG"}:
              continuity = "unknown"
          result = {"status": "unknown", "platform_applied": False, "request_id": os.environ["INPUT_REQUEST_ID"],
                    "operation": "enable" if sys.argv[1] == "true" else "disable", "continuity": continuity,
                    "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "target_sha256": hashlib.sha256(plan["service_name"].encode()).hexdigest(),
                    "enabled": None, "scheduler_state": "unknown", "revision_sha256": None}
          (Path(os.environ["RUNNER_TEMP"]) / "ibkr-runtime-switch-result.json").write_text(json.dumps(result), encoding="utf-8")
          PY
            if [ "${desired_switch}" = "false" ]; then
              uv run --no-sync python - "${evidence_dir}/baseline-service.json" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = json.loads(os.environ["SYNC_PLAN_JSON"])["targets"][0]
          project, region = os.environ["GCP_PROJECT_ID"], os.environ["CLOUD_RUN_REGION"]
          location = os.environ.get("CLOUD_SCHEDULER_LOCATION") or region
          result_path = Path(os.environ["RUNNER_TEMP"]) / "ibkr-runtime-switch-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          def run(args):
              value = subprocess.run(args, capture_output=True, text=True, check=False)
              if value.returncode:
                  raise SystemExit("runtime_switch_stop_scheduler_failed_or_unknown")
              return value.stdout
          service_args = ["gcloud", "run", "services", "describe", plan["service_name"], f"--project={project}", f"--region={region}", "--format=json"]
          current = json.loads(run(service_args))
          if not service.get("metadata", {}).get("resourceVersion") or service["metadata"]["resourceVersion"] != current.get("metadata", {}).get("resourceVersion"):
              raise SystemExit("runtime_switch_service_changed_before_stop")
          url = service["status"]["url"].rstrip("/") + "/run"
          jobs = json.loads(run(["gcloud", "scheduler", "jobs", "list", f"--project={project}", f"--location={location}", "--format=json"]))
          matches = [job for job in jobs if job.get("httpTarget", {}).get("uri", "").split("?", 1)[0].rstrip("/") == url]
          if len(matches) != 1 or matches[0].get("state") not in {"ENABLED", "PAUSED"}:
              raise SystemExit("runtime_switch_scheduler_not_unique")
          job = matches[0]; name = job["name"].rsplit("/", 1)[-1]
          if job["state"] == "ENABLED":
              run(["gcloud", "scheduler", "jobs", "pause", name, f"--project={project}", f"--location={location}", "--quiet"])
          after = json.loads(run(["gcloud", "scheduler", "jobs", "describe", name, f"--project={project}", f"--location={location}", "--format=json"]))
          fields = ("httpTarget", "schedule", "timeZone", "retryConfig", "attemptDeadline")
          if after.get("state") != "PAUSED" or any(job.get(key) != after.get(key) for key in fields):
              raise SystemExit("runtime_switch_stop_scheduler_readback_mismatch")
          result.update(status="partial", scheduler_state="PAUSED", scheduler_changed=job["state"] == "ENABLED")
          result_path.write_text(json.dumps(result), encoding="utf-8")
          print("runtime_switch_stop_scheduler_paused")
          PY
            fi
            if [ "${switch_unchanged}" = "true" ]; then
              printf '%s' "${baseline_revision}" > "${evidence_dir}/candidate-revision.txt"
              touch "${evidence_dir}/no-op"
              echo "Runtime switch already matches; checking scheduler without staging."
              exit 0
            fi
            gcloud run services describe "${cloud_run_service}" --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" --format=json > "${evidence_dir}/before-update.json"
            python - "${evidence_dir}/baseline-service.json" "${evidence_dir}/before-update.json" <<'PY'
          import json, sys
          before, current = [json.load(open(path, encoding="utf-8")) for path in sys.argv[1:]]
          if not before.get("metadata", {}).get("resourceVersion") or before["metadata"]["resourceVersion"] != current.get("metadata", {}).get("resourceVersion"):
              raise SystemExit("Runtime service changed before switch update.")
          PY
            gcloud run services update "${cloud_run_service}" --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" --no-traffic --revision-suffix="${revision_suffix}" \
              --update-env-vars="RUNTIME_TARGET_ENABLED=${desired_switch}" --quiet
            exit 0
          fi


              --no-traffic
              --deploy-health-check
              --startup-probe="httpGet.path=/health,httpGet.port=8080,periodSeconds=10,timeoutSeconds=5,failureThreshold=24"
              --remove-env-vars "$(IFS=,; echo "${remove_env_vars[*]}")"
              --update-env-vars "^|^$(join_by_delimiter "|" "${env_pairs[@]}")"
            )
            if [ "${EXACT_ENV_TRAFFIC:-false}" = "true" ]; then
              gcloud_args+=(--revision-suffix "${IBKR_ENV_SYNC_REVISION_SUFFIX}")
            fi

            if [ "${#remove_secret_vars[@]}" -gt 0 ]; then
              gcloud_args+=(--remove-secrets "$(IFS=,; echo "${remove_secret_vars[*]}")")
            fi

            if [ "${#secret_pairs[@]}" -gt 0 ]; then
              gcloud_args+=(--update-secrets "$(IFS=,; echo "${secret_pairs[*]}")")
            fi

            if [ "${#target_label_pairs[@]}" -gt 0 ]; then
              gcloud_args+=(--update-labels "$(IFS=,; echo "${target_label_pairs[*]}")")
            fi

            gcloud "${gcloud_args[@]}"
          done

      - name: Reconcile Cloud Run traffic
        if: steps.config.outputs.traffic_shift_enabled == 'true'
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail
          if [ -n "${IBKR_ENV_SYNC_EVIDENCE_DIR:-}" ] && [ -f "${IBKR_ENV_SYNC_EVIDENCE_DIR}/no-op" ]; then
            echo "No configuration revision was needed."
            exit 0
          fi
          exact_revision_args=()
          if [ -n "${IBKR_ENV_SYNC_EVIDENCE_DIR:-}" ]; then
            exact_revision_args+=(--env-sync-evidence-dir "${IBKR_ENV_SYNC_EVIDENCE_DIR}")
          fi
          if [ "${INPUT_RUNTIME_SWITCH_ONLY:-false}" = "true" ]; then
            exact_revision_args+=(--runtime-switch-only)
          fi
          uv run --no-sync python scripts/reconcile_cloud_runtime.py \
            --platform=ibkr \
            --project="${GCP_PROJECT_ID}" \
            --region="${CLOUD_RUN_REGION}" \
            --ensure-latest-traffic "${exact_revision_args[@]}"

      - name: Verify strategy plugin mounts
        if: steps.config.outputs.env_sync_enabled == 'true' && inputs.runtime_switch_only != true
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
          STRATEGY_PLUGIN_MOUNT_ENV_NAMES: IBKR_STRATEGY_PLUGIN_MOUNTS_JSON
        run: |
          set -euo pipefail
          python3 scripts/verify_cloud_run_strategy_plugin_mounts.py

      - name: Reconcile existing runtime switch scheduler
        if: steps.config.outputs.scheduler_sync_enabled == 'true' && inputs.runtime_switch_only == true
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from scripts.reconcile_cloud_runtime import validate_switch_baseline

          def run(args):
              result = subprocess.run(args, capture_output=True, text=True, check=False)
              if result.returncode != 0:
                  raise SystemExit("runtime_switch_scheduler_operation_failed_or_unknown")
              return result.stdout

          project = os.environ["GCP_PROJECT_ID"]
          region = os.environ["CLOUD_RUN_REGION"]
          location = os.environ.get("CLOUD_SCHEDULER_LOCATION") or region
          target = json.loads(os.environ["SYNC_PLAN_JSON"])["targets"][0]
          service_name = target["service_name"]
          revision_name = (Path(os.environ["IBKR_ENV_SYNC_EVIDENCE_DIR"]) / "candidate-revision.txt").read_text().strip()
          service_args = ["gcloud", "run", "services", "describe", service_name, f"--project={project}", f"--region={region}", "--format=json"]
          service = json.loads(run(service_args))
          traffic = [row for row in service.get("status", {}).get("traffic", []) if row.get("percent", 0) > 0]
          if len(traffic) != 1 or traffic[0].get("percent") != 100 or traffic[0].get("revisionName") != revision_name:
              raise SystemExit("runtime_switch_serving_revision_mismatch")
          revision = json.loads(run(["gcloud", "run", "revisions", "describe", revision_name, f"--project={project}", f"--region={region}", "--format=json"]))
          desired, unchanged = validate_switch_baseline(revision, target)
          if not unchanged:
              raise SystemExit("runtime_switch_serving_value_mismatch")
          url = service["status"]["url"].rstrip("/") + "/run"
          jobs = json.loads(run(["gcloud", "scheduler", "jobs", "list", f"--project={project}", f"--location={location}", "--format=json"]))
          matches = [job for job in jobs if job.get("httpTarget", {}).get("uri", "").split("?", 1)[0].rstrip("/") == url]
          if len(matches) != 1 or matches[0].get("state") not in {"ENABLED", "PAUSED"}:
              raise SystemExit("runtime_switch_scheduler_not_unique")
          before = matches[0]
          current = json.loads(run(service_args))
          if service.get("metadata", {}).get("resourceVersion") != current.get("metadata", {}).get("resourceVersion"):
              raise SystemExit("runtime_switch_service_changed")
          desired_state = "ENABLED" if desired == "true" else "PAUSED"
          job_name = before["name"].rsplit("/", 1)[-1]
          if before["state"] != desired_state:
              run(["gcloud", "scheduler", "jobs", "resume" if desired == "true" else "pause", job_name,
                   f"--project={project}", f"--location={location}", "--quiet"])
          after = json.loads(run(["gcloud", "scheduler", "jobs", "describe", job_name,
                                  f"--project={project}", f"--location={location}", "--format=json"]))
          fields = ("httpTarget", "schedule", "timeZone", "retryConfig", "attemptDeadline")
          if after.get("state") != desired_state or any(before.get(key) != after.get(key) for key in fields):
              raise SystemExit("runtime_switch_scheduler_readback_mismatch")
          result_path = Path(os.environ["RUNNER_TEMP"]) / "ibkr-runtime-switch-result.json"
          prior = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          continuity = json.loads(next(row["value"] for row in revision["spec"]["containers"][0]["env"] if row.get("name") == "RUNTIME_TARGET_JSON")).get("live_continuity", {}).get("state")
          if continuity not in {"ACTIVE_LKG", "ACTIVE_REDUCED", "RECONCILE_ONLY", "RISK_REDUCTION_ONLY", "PAUSED", "ROLLBACK_LKG"}:
              continuity = "unknown"
          result = {"status": "applied", "platform_applied": True, "enabled": desired == "true", "scheduler_state": desired_state,
                    "request_id": os.environ["INPUT_REQUEST_ID"],
                    "operation": "enable" if desired == "true" else "disable",
                    "continuity": continuity,
                    "service_changed": not (Path(os.environ["IBKR_ENV_SYNC_EVIDENCE_DIR"]) / "no-op").exists(),
                    "scheduler_changed": prior.get("scheduler_changed", False) or before["state"] != desired_state,
                    "revision_sha256": hashlib.sha256(revision_name.encode()).hexdigest(),
                    "target_sha256": hashlib.sha256(service_name.encode()).hexdigest(),
                    "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          result_path.write_text(json.dumps(result), encoding="utf-8")
          print(json.dumps(result))
          PY

      - name: Save runtime switch result
        if: always() && inputs.runtime_switch_only == true
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-runtime-switch-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ibkr-runtime-switch-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Sync Cloud Scheduler schedule
        if: steps.config.outputs.scheduler_sync_enabled == 'true' && inputs.runtime_switch_only != true
        env:
          SYNC_PLAN_JSON: ${{ steps.strategy_requirements.outputs.sync_plan_json }}
        run: |
          set -euo pipefail

          scheduler_location="${CLOUD_SCHEDULER_LOCATION:-${CLOUD_RUN_REGION}}"
          if [ -z "${scheduler_location}" ]; then
            echo "Cloud Scheduler schedule sync requires CLOUD_RUN_REGION or CLOUD_SCHEDULER_LOCATION." >&2
            exit 1
          fi
          if [ -z "${GCP_SCHEDULER_SERVICE_ACCOUNT:-}" ]; then
            echo "Cloud Scheduler schedule sync requires GCP_SCHEDULER_SERVICE_ACCOUNT." >&2
            exit 1
          fi

          mapfile -t scheduler_updates < <(python - <<'PY'
          import json
          import os

          def configured_time(name: str, default: str) -> str:
              return os.environ.get(name, "").strip() or default

          plan = json.loads(os.environ["SYNC_PLAN_JSON"])
          for target in plan["targets"]:
              service_name = str(target["service_name"]).strip()
              env = target.get("env") or {}
              scheduler = target.get("scheduler") or {}
              timezone = str(scheduler.get("timezone") or env.get("IBKR_MARKET_TIMEZONE") or "").strip()
              market = str(env.get("IBKR_MARKET") or "").strip().upper()
              if not timezone:
                  timezone = "Asia/Hong_Kong" if market == "HK" else "America/New_York"
              print(
                  "\t".join(
                      [
                          service_name,
                          timezone,
                          str(scheduler.get("main_time") or configured_time("CLOUD_SCHEDULER_MAIN_TIME", "45 15 * * 1-5")),
                          str(scheduler.get("probe_time") or configured_time("CLOUD_SCHEDULER_PROBE_TIME", "35 9,15 * * 1-5")),
                          str(scheduler.get("precheck_time") or configured_time("CLOUD_SCHEDULER_PRECHECK_TIME", "45 9 * * 1-5")),
                          str(bool(target.get("standard_execution_enabled", False))).lower(),
                          str(bool(target.get("drill_precheck_enabled", False))).lower(),
                          str(scheduler.get("attempt_deadline") or ""),
                      ]
                  )
              )
          PY
          )

          for update in "${scheduler_updates[@]}"; do
            IFS=$'\t' read -r cloud_run_service market_timezone main_time warmup_time precheck_time standard_execution_enabled drill_precheck_enabled main_attempt_deadline <<< "${update}"
            if [ -z "${cloud_run_service}" ] || [ -z "${market_timezone}" ]; then
              continue
            fi

            service_url="$(gcloud run services describe "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --format='value(status.url)' 2>/dev/null || true)"
            if [ -z "${service_url}" ]; then
              echo "Unable to resolve Cloud Run service URL for ${cloud_run_service}; cannot sync scheduler URI." >&2
              exit 1
            fi
            gcloud run services add-iam-policy-binding "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --member="serviceAccount:${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
              --role="roles/run.invoker" \
              --quiet
            gcloud run services add-iam-policy-binding "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --member="serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
              --role="roles/run.invoker" \
              --quiet

            scheduler_job_candidates=()
            if [[ "${cloud_run_service}" == *-service ]]; then
              scheduler_job_candidates+=("${cloud_run_service%-service}-scheduler")
            fi
            scheduler_job_candidates+=("${cloud_run_service}-scheduler")

            job_name=""
            current_schedule=""
            job_exists="false"
            for candidate_job in "${scheduler_job_candidates[@]}"; do
              current_schedule="$(gcloud scheduler jobs describe "${candidate_job}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --format='value(schedule)' 2>/dev/null || true)"
              if [ -n "${current_schedule}" ]; then
                job_name="${candidate_job}"
                job_exists="true"
                break
              fi
            done

            if [ -z "${current_schedule}" ]; then
              job_name="${scheduler_job_candidates[0]}"
              current_schedule="0 0 * * *"
            fi

            desired_schedule="$(CURRENT_SCHEDULE="${current_schedule}" SCHEDULE_TIME="${main_time}" python - <<'PY'
          import os

          current_fields = os.environ["CURRENT_SCHEDULE"].split()
          time_fields = os.environ["SCHEDULE_TIME"].split()
          if len(current_fields) != 5:
              raise SystemExit(f"Cloud Scheduler schedule must have 5 fields: {os.environ['CURRENT_SCHEDULE']!r}")
          if len(time_fields) == 5:
              print(" ".join(time_fields))
          elif len(time_fields) == 2:
              print(" ".join([*time_fields, *current_fields[2:]]))
          else:
              raise SystemExit(
                  f"Cloud Scheduler override must have 2 time fields or 5 cron fields: {os.environ['SCHEDULE_TIME']!r}"
              )
          PY
            )"

            desired_warmup_schedule="$(CURRENT_SCHEDULE="${desired_schedule}" SCHEDULE_TIME="${warmup_time}" python - <<'PY'
          import os

          current_fields = os.environ["CURRENT_SCHEDULE"].split()
          time_fields = os.environ["SCHEDULE_TIME"].split()
          if len(current_fields) != 5:
              raise SystemExit(f"Cloud Scheduler schedule must have 5 fields: {os.environ['CURRENT_SCHEDULE']!r}")
          if len(time_fields) == 5:
              print(" ".join(time_fields))
          elif len(time_fields) == 2:
              print(" ".join([*time_fields, *current_fields[2:]]))
          else:
              raise SystemExit(
                  f"Cloud Scheduler override must have 2 time fields or 5 cron fields: {os.environ['SCHEDULE_TIME']!r}"
              )
          PY
            )"

            desired_precheck_schedule="$(CURRENT_SCHEDULE="${desired_schedule}" SCHEDULE_TIME="${precheck_time}" python - <<'PY'
          import os

          current_fields = os.environ["CURRENT_SCHEDULE"].split()
          time_fields = os.environ["SCHEDULE_TIME"].split()
          if len(current_fields) != 5:
              raise SystemExit(f"Cloud Scheduler schedule must have 5 fields: {os.environ['CURRENT_SCHEDULE']!r}")
          if len(time_fields) == 5:
              print(" ".join(time_fields))
          elif len(time_fields) == 2:
              print(" ".join([*time_fields, *current_fields[2:]]))
          else:
              raise SystemExit(
                  f"Cloud Scheduler override must have 2 time fields or 5 cron fields: {os.environ['SCHEDULE_TIME']!r}"
              )
          PY
            )"

            scheduler_uri="${service_url}/run"
            main_attempt_deadline_args=()
            if [ -n "${main_attempt_deadline}" ]; then
              main_attempt_deadline_args+=(--attempt-deadline="${main_attempt_deadline}")
            fi
            if [ "${job_exists}" = "true" ]; then
              echo "Updating Cloud Scheduler job ${job_name} schedule to ${desired_schedule}, timezone to ${market_timezone}, and URI to ${scheduler_uri}."
              gcloud scheduler jobs update http "${job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${scheduler_uri}" \
                --schedule="${desired_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=POST \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                "${main_attempt_deadline_args[@]}" \
                --quiet
            else
              echo "Creating Cloud Scheduler job ${job_name} schedule ${desired_schedule}, timezone ${market_timezone}, and URI ${scheduler_uri}."
              gcloud scheduler jobs create http "${job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${scheduler_uri}" \
                --schedule="${desired_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=POST \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                "${main_attempt_deadline_args[@]}" \
                --quiet
            fi

            warmup_job_name="${cloud_run_service%-service}-warmup-scheduler"
            warmup_uri="${service_url}/health"
            if gcloud scheduler jobs describe "${warmup_job_name}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${scheduler_location}" >/dev/null 2>&1; then
              echo "Updating Cloud Scheduler warmup ${warmup_job_name} to ${desired_warmup_schedule}."
              gcloud scheduler jobs update http "${warmup_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${warmup_uri}" \
                --schedule="${desired_warmup_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=GET \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                --attempt-deadline=60s \
                --max-retry-attempts=2 \
                --min-backoff=15s \
                --max-backoff=60s \
                --max-doublings=2 \
                --quiet
            else
              echo "Creating Cloud Scheduler warmup ${warmup_job_name} at ${desired_warmup_schedule}."
              gcloud scheduler jobs create http "${warmup_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${warmup_uri}" \
                --schedule="${desired_warmup_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=GET \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                --attempt-deadline=60s \
                --max-retry-attempts=2 \
                --min-backoff=15s \
                --max-backoff=60s \
                --max-doublings=2 \
                --quiet
            fi

            precheck_job_name="${cloud_run_service%-service}-precheck-scheduler"
            precheck_uri="${service_url}/dry-run"
            precheck_retry_attempts=3
            precheck_retry_duration=900s
            if [ "${drill_precheck_enabled}" = "true" ]; then
              precheck_retry_attempts=0
              precheck_retry_duration=0s
            fi
            precheck_state="$(gcloud scheduler jobs describe "${precheck_job_name}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${scheduler_location}" \
              --format='value(state)' 2>/dev/null || true)"
            if [ -n "${precheck_state}" ]; then
              echo "Updating Cloud Scheduler precheck ${precheck_job_name} to ${desired_precheck_schedule}."
              gcloud scheduler jobs update http "${precheck_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${precheck_uri}" \
                --schedule="${desired_precheck_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=POST \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                --attempt-deadline=180s \
                --max-retry-attempts="${precheck_retry_attempts}" \
                --min-backoff=120s \
                --max-backoff=300s \
                --max-retry-duration="${precheck_retry_duration}" \
                --quiet
            else
              echo "Creating Cloud Scheduler precheck ${precheck_job_name} at ${desired_precheck_schedule}."
              gcloud scheduler jobs create http "${precheck_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --uri="${precheck_uri}" \
                --schedule="${desired_precheck_schedule}" \
                --time-zone="${market_timezone}" \
                --http-method=POST \
                --oidc-service-account-email="${GCP_SCHEDULER_SERVICE_ACCOUNT}" \
                --oidc-token-audience="${service_url}" \
                --attempt-deadline=180s \
                --max-retry-attempts="${precheck_retry_attempts}" \
                --min-backoff=120s \
                --max-backoff=300s \
                --max-retry-duration="${precheck_retry_duration}" \
                --quiet
            fi
            managed_scheduler_jobs=("${job_name}" "${warmup_job_name}" "${precheck_job_name}")
            for managed_job_name in "${managed_scheduler_jobs[@]}"; do
              managed_job_state="$(gcloud scheduler jobs describe "${managed_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --format='value(state)')"
              job_enabled="${standard_execution_enabled}"
              if [ "${managed_job_name}" = "${precheck_job_name}" ] && [ "${drill_precheck_enabled}" = "true" ]; then
                job_enabled=true
              fi
              case "${job_enabled}" in
                1|true|yes|on)
                  if [ "${managed_job_state}" = "PAUSED" ]; then
                    echo "Resuming approved Cloud Scheduler job ${managed_job_name}."
                    gcloud scheduler jobs resume "${managed_job_name}" \
                      --project="${GCP_PROJECT_ID}" \
                      --location="${scheduler_location}" \
                      --quiet
                  fi
                  desired_scheduler_state="ENABLED"
                  ;;
                *)
                  if [ "${managed_job_state}" != "PAUSED" ]; then
                    echo "Pausing Cloud Scheduler job ${managed_job_name} because it is not approved for this target."
                    gcloud scheduler jobs pause "${managed_job_name}" \
                      --project="${GCP_PROJECT_ID}" \
                      --location="${scheduler_location}" \
                      --quiet
                  fi
                  desired_scheduler_state="PAUSED"
                  ;;
              esac
              managed_job_state_after="$(gcloud scheduler jobs describe "${managed_job_name}" \
                --project="${GCP_PROJECT_ID}" \
                --location="${scheduler_location}" \
                --format='value(state)')"
              if [ "${managed_job_state_after}" != "${desired_scheduler_state}" ]; then
                echo "Scheduler state readback failed for ${managed_job_name}: expected ${desired_scheduler_state}, got ${managed_job_state_after:-<none>}." >&2
                exit 1
              fi
            done
          done

          reconcile_args=(
            --platform=ibkr
            --project="${GCP_PROJECT_ID}"
            --region="${CLOUD_RUN_REGION}"
            --scheduler-location="${scheduler_location}"
            --delete-legacy-schedulers
          )
          if [ "${WORKFLOW_TARGET:-configured}" != "configured" ] || [ -z "${INPUT_CONFIGURED_SERVICE:-}" ]; then
            python3 scripts/reconcile_cloud_runtime.py "${reconcile_args[@]}"
          fi

          for update in "${scheduler_updates[@]}"; do
            IFS=$'\t' read -r cloud_run_service _ <<< "${update}"
            legacy_env_names="$(gcloud run services describe "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --format='value(spec.template.spec.containers[0].env[].name)')"
            if ! printf '%s\n' "${legacy_env_names}" | tr ';' '\n' | grep -Fxq 'IBKR_MONITOR_DISPATCH_TARGETS_JSON'; then
              continue
            fi
            echo "Removing retired monitor dispatcher configuration from ${cloud_run_service}."
            gcloud run services update "${cloud_run_service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --remove-env-vars=IBKR_MONITOR_DISPATCH_TARGETS_JSON \
              --quiet
          done

      # Direct image and revision deletion is retired. The native repository
      # policy remains in dry-run; KEEP coverage is verified before deploy.

  notification-only:
    name: Fixed notification overlay / no traffic
    if: github.event_name == 'workflow_dispatch' && inputs.notification_only == true && (inputs.notification_marker_mode == '' || inputs.notification_marker_mode == 'disabled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GITHUB_CLOUD_RUN_DEPLOY: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_NOTIFICATION_READBACK_ONLY: ${{ inputs.notification_readback_only }}
      INPUT_CONFIGURED_SERVICE: ${{ inputs.configured_service }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_DEPLOY_IMAGE: ${{ inputs.deploy_image }}
      INPUT_SYNC_ENV: ${{ inputs.sync_env }}
      INPUT_APPROVE_TRAFFIC_SHIFT: ${{ inputs.approve_traffic_shift }}
      INPUT_APPROVE_SCHEDULER_SYNC: ${{ inputs.approve_scheduler_sync }}
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_RUNTIME_SERVICE_ACCOUNT: ${{ vars.IBKR_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID IBKR_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Admit fixed notification dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${ENABLE_GITHUB_CLOUD_RUN_DEPLOY}" = true
          if [ "${INPUT_DEPLOY_IMAGE}" = true ]; then
            test "${INPUT_SOURCE_COMMIT}" = 8ad644a724dbb9de63287d32b181a49c85e48af6
            test "${INPUT_NOTIFICATION_READBACK_ONLY}" = false
          else
            test "${INPUT_SOURCE_COMMIT}" = 07a98e1559ec1acf7199f419facfe5c3ad5f124d
          fi
          test "${INPUT_TARGET}" = configured
          test -z "${INPUT_CONFIGURED_SERVICE}"
          case "${INPUT_DEPLOY_IMAGE}" in true|false) ;; *) exit 2 ;; esac
          case "${INPUT_NOTIFICATION_READBACK_ONLY}" in true|false) ;; *) exit 2 ;; esac
          test "${INPUT_SYNC_ENV}" = false
          test "${INPUT_APPROVE_TRAFFIC_SHIFT}" = false
          test "${INPUT_APPROVE_SCHEDULER_SYNC}" = false
          test "${GCP_PROJECT_ID}" = interactivebrokersquant
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com
          test "${GCP_RUNTIME_SERVICE_ACCOUNT}" = ibkr-platform-runtime@interactivebrokersquant.iam.gserviceaccount.com

      - name: Checkout trusted notification orchestration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout frozen notification application
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false

      - name: Authenticate notification runner through original WIF binding
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up notification gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Build reviewed fixed overlay or reuse/read fixed candidate
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
        run: |
          if [ "${INPUT_NOTIFICATION_READBACK_ONLY}" = true ]; then mode=--readback-only; else mode=--execute; fi
          python3 -m scripts.deploy_notification_only \
            --source source \
            --report "${RUNNER_TEMP}/notification-only.json" \
            "$mode"

      - name: Summarize bounded notification result
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "notification-only.json"
          if report.is_file():
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
                  stream.write("Fixed notification release evidence (static pins; loaded UES not attested):\n\n```json\n")
                  stream.write(report.read_text())
                  stream.write("```\n")
          PY

  notification-binding-prepare:
    name: Prepare exact IBKR notification binding / read only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.notification_marker_mode == 'binding-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      INPUT_NOTIFICATION_MARKER_MODE: ${{ inputs.notification_marker_mode }}
      INPUT_APPROVE_MARKER_PROBE: ${{ inputs.approve_marker_probe }}
      INPUT_NOTIFICATION_ONLY: ${{ inputs.notification_only }}
      INPUT_NOTIFICATION_READBACK_ONLY: ${{ inputs.notification_readback_only }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIGURED_SERVICE: ${{ inputs.configured_service }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_EXPECTED_SERVING_REVISION_SHA256: ${{ inputs.expected_serving_revision_digest }}
      INPUT_EXPECTED_FULL_TARGET_SHA256: ${{ inputs.expected_full_target_digest }}
      INPUT_EXPECTED_SERVICE_SPEC_SHA256: ${{ inputs.expected_service_spec_digest }}
      INPUT_DEPLOY_IMAGE: ${{ inputs.deploy_image }}
      INPUT_SYNC_ENV: ${{ inputs.sync_env }}
      INPUT_APPROVE_TRAFFIC_SHIFT: ${{ inputs.approve_traffic_shift }}
      INPUT_APPROVE_SCHEDULER_SYNC: ${{ inputs.approve_scheduler_sync }}
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_RUNTIME_SERVICE_ACCOUNT: ${{ vars.IBKR_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID IBKR_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Admit one read-only binding preparation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${INPUT_SOURCE_COMMIT}" = 8ad644a724dbb9de63287d32b181a49c85e48af6
          test "${INPUT_TARGET}" = configured
          test -z "${INPUT_CONFIGURED_SERVICE}"
          for name in INPUT_APPROVE_MARKER_PROBE INPUT_NOTIFICATION_ONLY INPUT_NOTIFICATION_READBACK_ONLY INPUT_DEPLOY_IMAGE INPUT_SYNC_ENV INPUT_APPROVE_TRAFFIC_SHIFT INPUT_APPROVE_SCHEDULER_SYNC; do
            test "${!name}" = false
          done
          [[ "${INPUT_EXPECTED_SERVING_REVISION_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${INPUT_EXPECTED_FULL_TARGET_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${INPUT_EXPECTED_SERVICE_SPEC_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${GCP_PROJECT_ID}" = interactivebrokersquant
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com
          test "${GCP_RUNTIME_SERVICE_ACCOUNT}" = ibkr-platform-runtime@interactivebrokersquant.iam.gserviceaccount.com

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Prepare exact five-field diff without service write
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
          DIGEST_TARGET_BINDINGS_JSON: ${{ secrets.DIGEST_TARGET_BINDINGS_JSON }}
          DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI }}
          IBKR_NOTIFICATION_MARKER_GCS_URI: ${{ secrets.IBKR_NOTIFICATION_MARKER_GCS_URI }}
        run: python3 -m scripts.deploy_notification_only --source source --binding-prepare-only --report "${RUNNER_TEMP}/notification-binding-prepare.safe.json"

      - name: Preserve anonymous preparation result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-binding-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/notification-binding-prepare.safe.json
          if-no-files-found: error

  notification-binding-read:
    name: Read one exact IBKR business binding only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.notification_marker_mode == 'binding-read'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      INPUT_NOTIFICATION_MARKER_MODE: ${{ inputs.notification_marker_mode }}
      INPUT_APPROVE_MARKER_PROBE: ${{ inputs.approve_marker_probe }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIGURED_SERVICE: ${{ inputs.configured_service }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_NOTIFICATION_ONLY: ${{ inputs.notification_only }}
      INPUT_NOTIFICATION_READBACK_ONLY: ${{ inputs.notification_readback_only }}
      INPUT_DEPLOY_IMAGE: ${{ inputs.deploy_image }}
      INPUT_SYNC_ENV: ${{ inputs.sync_env }}
      INPUT_APPROVE_TRAFFIC_SHIFT: ${{ inputs.approve_traffic_shift }}
      INPUT_APPROVE_SCHEDULER_SYNC: ${{ inputs.approve_scheduler_sync }}
      RUNTIME_TARGET_JSON: ${{ secrets.RUNTIME_TARGET_JSON }}
      DIGEST_TARGET_BINDINGS_JSON: ${{ secrets.DIGEST_TARGET_BINDINGS_JSON }}
      DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID }}
      DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID }}
      IBKR_DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.IBKR_DIGEST_OPAQUE_ACCOUNT_UID }}
      IBKR_DIGEST_TARGET_ID: ${{ secrets.IBKR_DIGEST_TARGET_ID }}
      DIGEST_STORE_TARGET: ${{ vars.DIGEST_STORE_TARGET }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in IBKR_GCP_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Emit safe hashes and runner-private four-field projection
        run: python3 -m scripts.notification_marker_check --mode binding-read --report "${RUNNER_TEMP}/notification-binding.safe.json" --private-out "${RUNNER_TEMP}/notification-binding.private.json"
      - name: Preserve anonymous binding receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/notification-binding.safe.json
          if-no-files-found: error

  notification-marker-probe:
    name: Fixed synthetic marker Job control
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && ((inputs.notification_marker_mode == 'execute-probe' && inputs.approve_marker_probe == true) || ((inputs.notification_marker_mode == 'probe-readback' || inputs.notification_marker_mode == 'probe-validate-only') && inputs.approve_marker_probe == false))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_NOTIFICATION_MARKER_MODE: ${{ inputs.notification_marker_mode }}
      INPUT_APPROVE_MARKER_PROBE: ${{ inputs.approve_marker_probe }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIGURED_SERVICE: ${{ inputs.configured_service }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_NOTIFICATION_ONLY: ${{ inputs.notification_only }}
      INPUT_NOTIFICATION_READBACK_ONLY: ${{ inputs.notification_readback_only }}
      INPUT_DEPLOY_IMAGE: ${{ inputs.deploy_image }}
      INPUT_SYNC_ENV: ${{ inputs.sync_env }}
      INPUT_APPROVE_TRAFFIC_SHIFT: ${{ inputs.approve_traffic_shift }}
      INPUT_APPROVE_SCHEDULER_SYNC: ${{ inputs.approve_scheduler_sync }}
      ENABLE_GITHUB_CLOUD_RUN_DEPLOY: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_RUNTIME_SERVICE_ACCOUNT: ${{ vars.IBKR_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in IBKR_GCP_PROJECT_ID IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact one-time synthetic scope before authentication
        run: python3 -c 'import os; from scripts.notification_marker_check import validate_dispatch; validate_dispatch(os.environ["INPUT_NOTIFICATION_MARKER_MODE"], os.environ)'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 416.0.0"
      - name: Create and execute fixed Job once; retain object and Job
        if: inputs.notification_marker_mode == 'execute-probe'
        run: python3 -m scripts.notification_marker_check --mode execute-probe --report "${RUNNER_TEMP}/notification-marker.safe.json"
      - name: Read fixed nonce Job status only
        if: inputs.notification_marker_mode == 'probe-readback'
        run: python3 -m scripts.notification_marker_check --mode probe-readback --report "${RUNNER_TEMP}/notification-marker.safe.json"
      - name: Validate original fixed Job request without creating resources
        if: inputs.notification_marker_mode == 'probe-validate-only'
        run: python3 -m scripts.notification_marker_check --mode probe-validate-only --report "${RUNNER_TEMP}/notification-marker.safe.json"
      - name: Preserve synthetic receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-marker-${{ github.run_id }}
          path: ${{ runner.temp }}/notification-marker.safe.json
          if-no-files-found: error

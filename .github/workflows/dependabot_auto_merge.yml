name: Auto Merge Dependabot PR

"on":
  workflow_run:
    # Re-evaluated whenever one of the PR workflows finishes; the gate script waits for the rest.
    workflows: ["CI", "Documentation check", "Engineering governance"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # One evaluation per repository and Dependabot branch; a fork cannot reuse a same-repository key and displace a pending run.
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable auto-merge when every check is green
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh pr merge --auto --delete-branch
      pull-requests: write # enable auto-merge on the verified head
      checks: read # read every check run on the PR head
      statuses: read # read legacy commit statuses (risk-gate, pr-template)

    steps:
      # workflow_run uses only the trusted default branch, never the PR checkout.
      - name: Check out the default-branch gate script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate on every check and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRED_CHECKS: test,Documentation check,Gitleaks,Commit message convention,Evaluate PR governance
          REQUIRED_STATUSES: risk-gate,pr-template
        run: python3 scripts/dependabot_auto_merge_gate.py

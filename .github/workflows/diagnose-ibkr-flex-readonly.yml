name: Diagnose IBKR Flex Without Publishing

on:
  workflow_dispatch:
    inputs:
      read_once:
        description: Read one configured Flex report without publishing; never rerun a pending request
        type: boolean
        required: false
        default: false
      configured_account_coverage_only:
        description: Inspect fixed section counts and dates by protected configured slot; never publish
        type: boolean
        required: false
        default: false
      cash_source_only:
        description: Inspect Cash Report field coverage only; never certify current spending authority
        type: boolean
        required: false
        default: false
      cashflow_source_only:
        description: Inspect cash-transaction field and time formats only; do not publish
        type: boolean
        required: false
        default: false
      execution_source_only:
        description: Inspect native execution identity and fee conflicts in an explicit max-31-day window; never publish
        type: boolean
        required: false
        default: false
      cashflow_period_from:
        description: Optional cash-flow source request start (YYYY-MM-DD); pair with end, at most 31 days
        type: string
        required: false
        default: ""
      cashflow_period_to:
        description: Optional cash-flow source request end (YYYY-MM-DD); no query-template change
        type: string
        required: false
        default: ""
      expected_period_from:
        description: Expected start (YYYY-MM-DD), paired with end; required actual request start for execution_source_only
        type: string
        required: false
        default: ""
      expected_period_to:
        description: Expected end (YYYY-MM-DD); required actual request end for execution_source_only
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Share the existing query's execution lane, without changing the publisher.
concurrency:
  group: ibkr-flex-period-return
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.read_once }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IBKR_FLEX_EXPECTED_PERIOD_FROM: ${{ inputs.expected_period_from }}
      IBKR_FLEX_EXPECTED_PERIOD_TO: ${{ inputs.expected_period_to }}
      IBKR_FLEX_CASHFLOW_REQUEST_FROM: ${{ inputs.cashflow_period_from }}
      IBKR_FLEX_CASHFLOW_REQUEST_TO: ${{ inputs.cashflow_period_to }}
    steps:
      - name: Checkout approved main source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev
      - name: Validate the exact target and optional period without requests
        run: |
          selected_modes=0
          for enabled in "$CASH_SOURCE_ONLY" "$CASHFLOW_SOURCE_ONLY" "$CONFIGURED_ACCOUNT_COVERAGE_ONLY" "$EXECUTION_SOURCE_ONLY"; do
            if [ "$enabled" = "true" ]; then selected_modes=$((selected_modes + 1)); fi
          done
          if [ "$selected_modes" -gt 1 ]; then
            echo "conflicting_diagnostic_modes" >&2
            exit 2
          fi
          preflight_args=(--preflight)
          if [ "$CONFIGURED_ACCOUNT_COVERAGE_ONLY" = "true" ]; then
            preflight_args+=(--configured-account-coverage-only)
          elif [ "$EXECUTION_SOURCE_ONLY" = "true" ]; then
            preflight_args+=(--execution-source-only)
          fi
          uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger "${preflight_args[@]}"
        env:
          CONFIGURED_ACCOUNT_COVERAGE_ONLY: ${{ inputs.configured_account_coverage_only }}
          CASH_SOURCE_ONLY: ${{ inputs.cash_source_only }}
          CASHFLOW_SOURCE_ONLY: ${{ inputs.cashflow_source_only }}
          EXECUTION_SOURCE_ONLY: ${{ inputs.execution_source_only }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
          IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
          IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      - name: Read the original Flex request only and print fixed status
        run: |
          if [ "$CONFIGURED_ACCOUNT_COVERAGE_ONLY" = "true" ]; then
            uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger --configured-account-coverage-read-once
          elif [ "$EXECUTION_SOURCE_ONLY" = "true" ]; then
            uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger --execution-read-once
          elif [ "$CASHFLOW_SOURCE_ONLY" = "true" ]; then
            uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger --cashflow-read-once
          elif [ "$CASH_SOURCE_ONLY" = "true" ]; then
            uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger --cash-read-once
          else
            uv run --no-sync python -m scripts.diagnose_ibkr_flex_ledger --read-once
          fi
        env:
          CONFIGURED_ACCOUNT_COVERAGE_ONLY: ${{ inputs.configured_account_coverage_only }}
          CASH_SOURCE_ONLY: ${{ inputs.cash_source_only }}
          CASHFLOW_SOURCE_ONLY: ${{ inputs.cashflow_source_only }}
          EXECUTION_SOURCE_ONLY: ${{ inputs.execution_source_only }}
          IBKR_FLEX_DIAGNOSTIC_ENABLED: "true"
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
          IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
          IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}

name: Inspect Account Facts Archive (protected execution)
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      archive_date:
        type: string
        required: true
      scope:
        type: string
        required: true
      comparison_nonce:
        type: string
        required: false
        default: ''
    secrets:
      IBKR_PERIOD_RETURN_ADDITIONAL_ACCOUNT_KEYS_JSON:
        required: false
      IBKR_PERIOD_RETURN_ADDITIONAL1_ACCOUNT_KEY:
        required: false
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: false
      ACCOUNT_FACTS_RECOVERY_WIF_PROVIDER:
        required: false
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_TARGET_ID:
        required: false
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX:
        required: false
      IBKR_ACCOUNT_FACTS_PROJECT_ID:
        required: false
      IBKR_ACCOUNT_FACTS_SERVICE_NAME:
        required: false
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION:
        required: false
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE:
        required: false
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR:
        required: false

permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAILY_COMPARISON_NONCE: ${{ inputs.comparison_nonce }}
      IBKR_PERIOD_RETURN_ADDITIONAL_ACCOUNT_KEYS_JSON: ${{ secrets.IBKR_PERIOD_RETURN_ADDITIONAL_ACCOUNT_KEYS_JSON }}
      IBKR_PERIOD_RETURN_ADDITIONAL1_ACCOUNT_KEY: ${{ secrets.IBKR_PERIOD_RETURN_ADDITIONAL1_ACCOUNT_KEY }}
      IBKR_ACCOUNT_FACTS_TARGET: ${{ inputs.target }}
      REQUESTED_TARGET: ${{ inputs.target }}
      IBKR_ACCOUNT_FACTS_ARCHIVE_DATE: ${{ inputs.archive_date }}
      IBKR_ACCOUNT_FACTS_ARCHIVE_MODE: ${{ inputs.scope }}
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
    steps:
      - name: Require infrastructure variables
        if: inputs.scope != 'daily-comparison'
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IBKR_DEPLOY_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::IBKR_DEPLOY_SERVICE_ACCOUNT is required" >&2
            exit 2
          fi
      - uses: actions/checkout@v6
      - name: Authenticate with the existing archive read identity
        if: inputs.scope != 'daily-comparison'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.ACCOUNT_FACTS_RECOVERY_WIF_PROVIDER }}
          service_account: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.scope != 'daily-comparison'
      - name: Compare one configured source without reading reports
        if: inputs.scope == 'daily-comparison'
        run: python3 -m scripts.compare_website_daily_binding
      - name: Inspect one original report day without publishing
        if: inputs.scope != 'daily-comparison'
        run: python3 -m scripts.inspect_account_facts_archive

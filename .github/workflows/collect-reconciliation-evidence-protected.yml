name: Collect IBKR Reconciliation Evidence (protected execution)

# Register the original JSON as a workflow secret before any runner step header.
# This masks the passed value, not every extracted field or reserialized variant.
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: false
      inspect_flex_runtime_binding_only:
        type: boolean
        required: false
      inspect_recovery_receipt_only:
        type: boolean
        required: false
      reconciliation_run_id:
        type: string
        required: false
      inspect_execution_ledger:
        type: boolean
        required: false
      initial_enrollment:
        type: boolean
        required: false
      publish_initial_run_id:
        type: string
        required: false
      verify_initial_source_run_id:
        type: string
        required: false
      verify_initial_current_run_id:
        type: string
        required: false
      archive_initial_state_ledger:
        type: boolean
        required: false
    secrets:
      IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX:
        required: false
      RECONCILIATION_RECOVERY_SYNC_TOKEN:
        required: false
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN:
        required: false
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: false

      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON:
        required: false
      IBKR_ACCOUNT_FACTS_PROJECT_ID:
        required: false
      IBKR_ACCOUNT_FACTS_SERVICE_NAME:
        required: false
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION:
        required: false
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE:
        required: false
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR:
        required: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
  GCP_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.IBKR_SCHEDULER_SERVICE_ACCOUNT }}

jobs:
  resolve-matrix:
    name: Resolve reconciliation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.render.outputs.matrix }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.IBKR_SCHEDULER_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID IBKR_SCHEDULER_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve reconciliation profiles from private inventory
        id: render
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
          INITIAL_ENROLLMENT: ${{ inputs.initial_enrollment }}
          REQUESTED_TARGET: ${{ inputs.target }}
          INSPECT_BINDING: ${{ inputs.inspect_flex_runtime_binding_only }}
          INSPECT_RECEIPT: ${{ inputs.inspect_recovery_receipt_only }}
          PUBLISH_INITIAL_RUN_ID: ${{ inputs.publish_initial_run_id }}
          VERIFY_INITIAL_SOURCE: ${{ inputs.verify_initial_source_run_id }}
          VERIFY_INITIAL_CURRENT: ${{ inputs.verify_initial_current_run_id }}
          ARCHIVE_INITIAL_STATE_LEDGER: ${{ inputs.archive_initial_state_ledger }}
        run: |
          set -euo pipefail
          if [ "${INITIAL_ENROLLMENT:-false}" = true ] && { [ "${REQUESTED_TARGET:-all}" = all ] || [ "${INSPECT_BINDING:-false}" = true ] || [ "${INSPECT_RECEIPT:-false}" = true ]; }; then
            echo 'initial_enrollment_requires_one_target' >&2
            exit 1
          fi
          if [ -n "${PUBLISH_INITIAL_RUN_ID:-}" ] && { [ "${REQUESTED_TARGET:-all}" = all ] || [ "${INITIAL_ENROLLMENT:-false}" = true ] || [ "${INSPECT_BINDING:-false}" = true ] || [ "${INSPECT_RECEIPT:-false}" = true ] || [[ ! "$PUBLISH_INITIAL_RUN_ID" =~ ^[0-9]+$ ]]; }; then
            echo 'initial_publish_requires_one_completed_run_and_target' >&2
            exit 1
          fi
          if [ -n "${VERIFY_INITIAL_SOURCE:-}${VERIFY_INITIAL_CURRENT:-}" ] && { [ "${REQUESTED_TARGET:-all}" = all ] || [ "${INITIAL_ENROLLMENT:-false}" = true ] || [ -n "${PUBLISH_INITIAL_RUN_ID:-}" ] || [ "${INSPECT_BINDING:-false}" = true ] || [ "${INSPECT_RECEIPT:-false}" = true ] || [[ ! "${VERIFY_INITIAL_SOURCE:-}" =~ ^[0-9]+$ ]] || [[ ! "${VERIFY_INITIAL_CURRENT:-}" =~ ^[0-9]+$ ]]; }; then
            echo 'initial_verification_requires_two_completed_runs_and_one_target' >&2
            exit 1
          fi
          if [ "${ARCHIVE_INITIAL_STATE_LEDGER:-false}" = true ] && { [[ ! "${VERIFY_INITIAL_SOURCE:-}" =~ ^[0-9]+$ ]] || [[ ! "${VERIFY_INITIAL_CURRENT:-}" =~ ^[0-9]+$ ]]; }; then
            echo 'initial_state_ledger_requires_verified_initial_runs' >&2
            exit 1
          fi
          python3 scripts/render_runtime_target_matrix.py --profile reconciliation --private-config --github-output

  publish-initial:
    if: ${{ inputs.publish_initial_run_id != '' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    needs: resolve-matrix
    environment: reconciliation-recovery-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      REQUESTED_TARGET: ${{ inputs.target }}
      SOURCE_RUN_ID: ${{ inputs.publish_initial_run_id }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN }}
      QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
        run: |
          set -euo pipefail
          for name in IBKR_GCP_PROJECT_ID IBKR_DEPLOY_SERVICE_ACCOUNT QSL_CONSOLE_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is required" >&2; exit 2; fi
          done
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --frozen --no-dev
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Publish one protected initial source
        run: |
          set -euo pipefail
          uv run --no-sync python -m scripts.publish_reconciliation_recovery_source \
            --trusted-initial-run "$SOURCE_RUN_ID" \
            --publish-url "${QSL_CONSOLE_BASE_URL%/}/api/internal/sync-reconciliation-recovery-source"

  verify-initial:
    if: ${{ inputs.verify_initial_source_run_id != '' && inputs.verify_initial_current_run_id != '' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    needs: resolve-matrix
    environment: reconciliation-recovery-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      REQUESTED_TARGET: ${{ inputs.target }}
      SOURCE_RUN_ID: ${{ inputs.verify_initial_source_run_id }}
      CURRENT_RUN_ID: ${{ inputs.verify_initial_current_run_id }}
      ARCHIVE_INITIAL_STATE_LEDGER: ${{ inputs.archive_initial_state_ledger }}
      IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX: ${{ secrets.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN }}
      IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI: ${{ vars.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_URI }}
      QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
        run: |
          set -euo pipefail
          for name in IBKR_GCP_PROJECT_ID IBKR_DEPLOY_SERVICE_ACCOUNT QSL_CONSOLE_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is required" >&2; exit 2; fi
          done
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --frozen --no-dev
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify one confirmed initial source without state writes
        run: |
          set -euo pipefail
          archive_args=()
          if [ "${ARCHIVE_INITIAL_STATE_LEDGER:-false}" = true ]; then archive_args+=(--archive-initial-state-ledger); fi
          uv run --no-sync python -m scripts.verify_reconciliation_recovery \
            --trusted-initial-source-run "$SOURCE_RUN_ID" --current-trusted-run-id "$CURRENT_RUN_ID" \
            --confirmation-url "${QSL_CONSOLE_BASE_URL%/}/api/internal/reconciliation-recovery-confirmation" "${archive_args[@]}"

  flex-runtime-binding:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: resolve-matrix
    if: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only) && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    name: Compare protected Flex and serving runtime identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUESTED_TARGET: ${{ inputs.target }}
      RECONCILIATION_RUN_ID: ${{ inputs.reconciliation_run_id }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done
      - name: Checkout approved diagnostic source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate protected identity configuration without cloud reads
        run: python3 -m scripts.diagnose_ibkr_flex_runtime_binding --preflight
      - name: Authenticate with the existing reconciliation identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up metadata commands
        uses: google-github-actions/setup-gcloud@v3
      - name: Compare configuration with the exact serving revisions
        if: ${{ !inputs.inspect_recovery_receipt_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.diagnose_ibkr_flex_runtime_binding

      - name: Install dependencies for trusted recovery receipt preflight
        if: ${{ inputs.inspect_recovery_receipt_only }}
        run: |
          python3 -m pip install uv
          uv sync --frozen --no-dev
      - name: Check trusted recovery receipt without state changes
        if: ${{ inputs.inspect_recovery_receipt_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.verify_reconciliation_recovery --trusted-current-preflight

  collect:
    if: ${{ !inputs.inspect_flex_runtime_binding_only && !inputs.inspect_recovery_receipt_only && inputs.publish_initial_run_id == '' && inputs.verify_initial_source_run_id == '' && inputs.verify_initial_current_run_id == '' }}
    needs: resolve-matrix
    name: Read ${{ matrix.profile }} baseline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
          IBKR_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.IBKR_SCHEDULER_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID IBKR_SCHEDULER_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Select requested target
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_TARGET" = "all" ] || [ "$REQUESTED_TARGET" = "$PROFILE" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout for optional execution ledger diagnostic
        id: ledger_source
        if: ${{ steps.selection.outputs.selected == 'true' && inputs.inspect_execution_ledger }}
        uses: actions/checkout@v6

      - name: Resolve selected service from private inventory
        id: runtime_target
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["CLOUD_RUN_SERVICE_TARGETS_JSON"])
          entries = payload.get("targets") if isinstance(payload, dict) else payload
          matches = []
          for item in entries:
              if not isinstance(item, dict) or item.get("include_reconciliation") is not True:
                  continue
              runtime = item.get("runtime_target") or {}
              if isinstance(runtime, str):
                  runtime = json.loads(runtime)
              if runtime.get("strategy_profile") == os.environ["PROFILE"]:
                  service = str(item.get("service") or item.get("service_name") or "").strip()
                  if service and runtime.get("service_name") == service:
                      matches.append(service)
          if len(matches) != 1:
              raise SystemExit("expected exactly one private reconciliation service")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"service={matches[0]}\n")
          PY

      - name: Authenticate to Google Cloud
        id: cloud_auth
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        id: cloud_cli
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Cloud Run audience
        id: audience
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          SERVICE: ${{ steps.runtime_target.outputs.service }}
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$service_url"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Schedule one-shot internal reconciliation request
        id: scheduler
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          PROFILE: ${{ matrix.profile }}
          SERVICE_URL: ${{ steps.audience.outputs.service_url }}
          INITIAL_ENROLLMENT: ${{ inputs.initial_enrollment }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          job_name="ibkr-reconcile-${PROFILE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          request_id="$(python -c 'import uuid; print(uuid.uuid4())')"
          headers="X-QSL-Reconciliation-Request-Id=${request_id}"
          if [ "${INITIAL_ENROLLMENT:-false}" = true ]; then
            headers="${headers},X-QSL-Initial-Enrollment=v1"
          fi
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          case "$PROFILE" in
            soxl_soxx_trend_income) delay_minutes=3 ;;
            tqqq_growth_income) delay_minutes=5 ;;
            global_etf_rotation) delay_minutes=7 ;;
            russell_top50_leader_rotation) delay_minutes=9 ;;
            *)
              echo "Unsupported reconciliation profile: $PROFILE" >&2
              exit 1
              ;;
          esac
          schedule="$(date -u -d "+${delay_minutes} minutes" '+%M %H %d %m *')"
          if gcloud scheduler jobs describe "$job_name" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1; then
            echo "Refusing to replace an existing reconciliation job: $job_name" >&2
            exit 1
          fi
          gcloud scheduler jobs create http "$job_name" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --schedule "$schedule" \
            --time-zone 'Etc/UTC' \
            --uri "${SERVICE_URL}/reconcile" \
            --http-method POST \
            --headers "$headers" \
            --oidc-service-account-email "$GCP_SCHEDULER_SERVICE_ACCOUNT" \
            --oidc-token-audience "$SERVICE_URL" \
            --attempt-deadline '300s' \
            --max-retry-attempts=0 \
            --max-retry-duration=0s \
            --quiet >/dev/null
          scheduler_job_config="$(gcloud scheduler jobs describe "$job_name" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --format=json)"
          jq -e --arg expected "projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/jobs/${job_name}" '.name == $expected' <<< "$scheduler_job_config" >/dev/null
          configured_request_id="$(jq -er '.httpTarget.headers["X-QSL-Reconciliation-Request-Id"] | select(type == "string" and length > 0)' <<< "$scheduler_job_config")"
          test "$configured_request_id" = "$request_id"
          scheduler_job_sha256="$(printf '%s' "$job_name" | sha256sum | awk '{print $1}')"
          test "${#scheduler_job_sha256}" -eq 64
          {
            echo "job_name=$job_name"
            echo "request_id=$request_id"
            echo "scheduler_job_sha256=$scheduler_job_sha256"
            echo "requested_at=$requested_at"
          } >> "$GITHUB_OUTPUT"

      # This provenance binds the report-serving revision and its image deploy labels only;
      # it does not prove scheduler correlation or that this workflow run created the revision.
      - name: Read private no-order reconciliation candidate
        id: receipt
        if: ${{ steps.selection.outputs.selected == 'true' }}
        env:
          PROFILE: ${{ matrix.profile }}
          SERVICE: ${{ steps.runtime_target.outputs.service }}
          SCHEDULER_JOB_SHA256: ${{ steps.scheduler.outputs.scheduler_job_sha256 }}
          REQUESTED_AT: ${{ steps.scheduler.outputs.requested_at }}
          INITIAL_ENROLLMENT: ${{ inputs.initial_enrollment }}
        run: |
          set -euo pipefail
          test -n "$SCHEDULER_JOB_SHA256"
          test -n "$REQUESTED_AT"
          mkdir -p reports
          log_entry=''
          logging_read_failures=0
          logging_read_attempts=0
          receipt_marker_seen=false
          # Cover the longest dispatch delay, full request deadline and log ingestion.
          log_wait_seconds=$((9 * 60 + 300 + 120))
          log_deadline=$((SECONDS + log_wait_seconds))
          while [ "$SECONDS" -lt "$log_deadline" ]; do
            logging_read_attempts=$((logging_read_attempts + 1))
            logging_output=''
            logging_read_status=0
            logging_output="$(timeout --kill-after=5s 30s gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\" AND timestamp>=\"${REQUESTED_AT}\" AND textPayload:\"reconciliation_receipt_ready\"" --project "$GCP_PROJECT_ID" --freshness=30m --limit=10 --format=json 2>/dev/null)" || logging_read_status=$?
            if [ "$logging_read_status" -ne 0 ]; then
              logging_read_failures=$((logging_read_failures + 1))
              sleep 5
              continue
            fi
            if ! jq -e . >/dev/null <<< "$logging_output"; then
              echo "reconciliation_log_query_failed class=invalid_logging_json" >&2
              exit 1
            fi
            if jq -e '[.[] | select(.textPayload? | type == "string") | select(.textPayload | startswith("reconciliation_receipt_ready "))] | length > 0' >/dev/null <<< "$logging_output"; then
              receipt_marker_seen=true
            fi
            log_entry="$(jq -c --arg scheduler_job_sha256 "$SCHEDULER_JOB_SHA256" 'first(.[] | select(.textPayload? | type == "string") | select(.textPayload | startswith("reconciliation_receipt_ready scheduler_job_sha256=" + $scheduler_job_sha256 + " report_uri=gs://")) | select(.resource.labels.revision_name? | type == "string" and length > 0)) // empty' <<< "$logging_output")"
            if [ -n "$log_entry" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$log_entry" ]; then
            if [ "$logging_read_failures" -eq "$logging_read_attempts" ]; then
              echo "reconciliation_log_query_failed class=logging_read_nonzero_exit" >&2
            elif [ "$logging_read_failures" -gt 0 ]; then
              echo "reconciliation_log_query_failed class=mixed_logging_read_failures_no_candidate" >&2
            elif [ "$receipt_marker_seen" = true ]; then
              echo "reconciliation_log_query_timeout class=receipt_scheduler_job_mismatch" >&2
            else
              echo "reconciliation_log_query_timeout class=no_matching_candidate" >&2
            fi
            exit 1
          fi
          receipt="$(jq -cer --arg scheduler_job_sha256 "$SCHEDULER_JOB_SHA256" '.textPayload | capture("^reconciliation_receipt_ready scheduler_job_sha256=(?<scheduler_job_sha256>[0-9a-f]{64}) report_uri=(?<uri>gs://[^[:space:]]+)$") | select(.scheduler_job_sha256 == $scheduler_job_sha256)' <<< "$log_entry")"
          report_uri="$(jq -er '.uri' <<< "$receipt")"
          serving_revision="$(jq -er '.resource.labels.revision_name | select(type == "string" and length > 0)' <<< "$log_entry")"
          if [ "${INITIAL_ENROLLMENT:-false}" != true ]; then
            revision_labels="$(gcloud run revisions describe "$serving_revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='json(metadata.labels)')"
            if ! service_revision_commit_sha="$(jq -er '.metadata.labels."commit-sha" | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$revision_labels" 2>/dev/null)"; then
              echo 'reconciliation_source_unqualified field=commit_sha class=missing_or_invalid' >&2
              exit 1
            fi
            if ! service_deploy_run_id="$(jq -er '.metadata.labels."github-run-id" | select(type == "string" and test("^[0-9]+$"))' <<< "$revision_labels" 2>/dev/null)"; then
              echo 'reconciliation_source_unqualified field=github_run_id class=missing_or_invalid' >&2
              exit 1
            fi
          fi
          gcloud storage cat "$report_uri" | jq --arg profile "$PROFILE" --arg scheduler_job_sha256 "$SCHEDULER_JOB_SHA256" '
            .diagnostics.broker_reconciliation as $candidate
            | {
                schema_version: "ibkr_reconciliation_artifact.v1",
                strategy_profile: $profile,
                reconciliation_scheduler_job_sha256: .diagnostics.reconciliation_scheduler_job_sha256,
                report_status: .status,
                reconciliation: $candidate,
                errors: [
                  .errors[]? | {
                    stage,
                    error_type,
                    failure_category
                  }
                ]
              }
          ' > "reports/${PROFILE}.json"
          jq -e --arg profile "$PROFILE" --arg scheduler_job_sha256 "$SCHEDULER_JOB_SHA256" '
            .schema_version == "ibkr_reconciliation_artifact.v1"
            and .strategy_profile == $profile
            and .reconciliation_scheduler_job_sha256 == $scheduler_job_sha256
            and .reconciliation.schema_version == "ibkr_reconciliation_candidate.v1"
            and .reconciliation.evidence.platform_id == "ibkr"
            and .reconciliation.evidence.strategy_profile == $profile
            and (.reconciliation.recovery_blockers | type == "array")
          ' "reports/${PROFILE}.json" >/dev/null
          evidence_sha256="$(jq -er '.reconciliation.evidence.evidence_sha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' "reports/${PROFILE}.json")"
          test "${#evidence_sha256}" -eq 64
          if [ "${INITIAL_ENROLLMENT:-false}" != true ]; then
            {
              echo "evidence_sha256=$evidence_sha256"
              echo "serving_revision=$serving_revision"
              echo "service_revision_commit_sha=$service_revision_commit_sha"
              echo "service_deploy_run_id=$service_deploy_run_id"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ "${INITIAL_ENROLLMENT:-false}" = true ]; then
            echo 'initial_private_report_recorded=true'
          else
            jq -r '[.reconciliation.permits_active_lkg, .reconciliation.expected_digests_configured, (.reconciliation.recovery_blockers | length)] | @tsv' \
              "reports/${PROFILE}.json" | awk -F '\t' '{print "candidate_collected permits_active_lkg=" $1 ", expected_digests_configured=" $2 ", blockers=" $3}'
          fi

      - name: Delete temporary internal reconciliation job
        if: ${{ always() && steps.selection.outputs.selected == 'true' }}
        env:
          SCHEDULER_JOB: ${{ steps.scheduler.outputs.job_name }}
        run: |
          set -euo pipefail
          if [ -n "$SCHEDULER_JOB" ]; then
            gcloud scheduler jobs delete "$SCHEDULER_JOB" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --quiet
          fi

      - name: Retain redacted candidate
        id: receipt_artifact
        if: ${{ success() && steps.selection.outputs.selected == 'true' && inputs.initial_enrollment != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ibkr-reconciliation-${{ matrix.profile }}-${{ github.run_id }}
          path: reports/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate reconciliation source record
        if: ${{ success() && steps.selection.outputs.selected == 'true' && inputs.initial_enrollment != true }}
        env:
          ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.receipt_artifact.outputs.artifact-digest }}
          EVIDENCE_SHA256: ${{ steps.receipt.outputs.evidence_sha256 }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          PROFILE: ${{ matrix.profile }}
          SERVICE: ${{ steps.runtime_target.outputs.service }}
          SERVICE_REVISION: ${{ steps.receipt.outputs.serving_revision }}
          SERVICE_REVISION_COMMIT_SHA: ${{ steps.receipt.outputs.service_revision_commit_sha }}
          SERVICE_DEPLOY_RUN_ID: ${{ steps.receipt.outputs.service_deploy_run_id }}
          SCHEDULER_JOB_SHA256: ${{ steps.scheduler.outputs.scheduler_job_sha256 }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'QuantStrategyLab/InteractiveBrokersPlatform'
          test "$WORKFLOW_REF" = "${REPOSITORY}/.github/workflows/collect-reconciliation-evidence.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$WORKFLOW_HEAD_SHA"
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_SHA256" != "$EVIDENCE_SHA256"
          for digest in "$ARTIFACT_SHA256" "$EVIDENCE_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!0-9a-f]*) exit 1 ;; esac
          done
          for sha in "$WORKFLOW_HEAD_SHA" "$SERVICE_REVISION_COMMIT_SHA"; do
            test "${#sha}" -eq 40
            case "$sha" in *[!0-9a-f]*) exit 1 ;; esac
          done
          test "${#SCHEDULER_JOB_SHA256}" -eq 64
          case "$SCHEDULER_JOB_SHA256" in *[!0-9a-f]*) exit 1 ;; esac
          mkdir -p source-records
          source_record="source-records/${PROFILE}.json"
          jq -n \
            --arg schema_version 'ibkr_reconciliation_source_receipt_record.v1' \
            --arg repository "$REPOSITORY" \
            --arg workflow_path '.github/workflows/collect-reconciliation-evidence.yml' \
            --arg workflow_run_id "$WORKFLOW_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg workflow_head_sha "$WORKFLOW_HEAD_SHA" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "ibkr-reconciliation-${PROFILE}-${WORKFLOW_RUN_ID}" \
            --arg artifact_sha256 "$ARTIFACT_SHA256" \
            --arg evidence_sha256 "$EVIDENCE_SHA256" \
            --arg service_name "$SERVICE" \
            --arg service_revision "$SERVICE_REVISION" \
            --arg service_revision_commit_sha "$SERVICE_REVISION_COMMIT_SHA" \
            --arg service_deploy_run_id "$SERVICE_DEPLOY_RUN_ID" \
            --arg scheduler_job_sha256 "$SCHEDULER_JOB_SHA256" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              workflow_path: $workflow_path,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              workflow_head_sha: $workflow_head_sha,
              artifact_id: $artifact_id,
              artifact_name: $artifact_name,
              artifact_sha256: $artifact_sha256,
              evidence_sha256: $evidence_sha256,
              service_name: $service_name,
              service_revision: $service_revision,
              service_revision_commit_sha: $service_revision_commit_sha,
              service_deploy_run_id: $service_deploy_run_id,
              scheduler_job_sha256: $scheduler_job_sha256
            }' > "$source_record"
          jq -e '
            (keys | sort) == [
              "artifact_id",
              "artifact_name",
              "artifact_sha256",
              "evidence_sha256",
              "repository",
              "scheduler_job_sha256",
              "schema_version",
              "service_deploy_run_id",
              "service_name",
              "service_revision",
              "service_revision_commit_sha",
              "workflow_head_sha",
              "workflow_path",
              "workflow_run_attempt",
              "workflow_run_id"
            ]
            and all(.[]; type == "string" and length > 0)
          ' "$source_record" >/dev/null

      - name: Upload reconciliation source record
        id: source_record_artifact
        if: ${{ success() && steps.selection.outputs.selected == 'true' && inputs.initial_enrollment != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ibkr-reconciliation-source-record-${{ matrix.profile }}-${{ github.run_id }}
          path: source-records/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize scoped execution record types
        # The ledger is independently readable even when the broker probe fails.
        # Preserve that probe's failure; never imply it succeeded from this read.
        if: ${{ always() && !cancelled() && steps.selection.outputs.selected == 'true' && inputs.inspect_execution_ledger && steps.ledger_source.outcome == 'success' && steps.runtime_target.outcome == 'success' && steps.cloud_auth.outcome == 'success' && steps.cloud_cli.outcome == 'success' }}
        env:
          SERVICE: ${{ steps.runtime_target.outputs.service }}
        run: |
          set -euo pipefail
          python3 scripts/summarize_execution_ledger_cloud.py \
            --service "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION"

name: Deploy Cloud Run
run-name: ${{ inputs.runtime_switch_only && format('Runtime switch {0}', inputs.request_id) || (inputs.notification_marker_mode != '' && inputs.notification_marker_mode != 'disabled' && 'Notification check (isolated)' || 'Deploy Cloud Run') }}

on:
  workflow_dispatch:
    inputs:
      notification_marker_mode:
        description: "Isolated notification binding read/prepare or retained synthetic marker Job; deployment controls stay false."
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - binding-read
          - binding-prepare
          - execute-probe
          - probe-readback
          - probe-validate-only
      approve_marker_probe:
        description: "Separate approval for exactly one retained synthetic Job/object; never cleanup or production changes."
        required: true
        type: boolean
        default: false
      notification_only:
        description: "Build the fixed reviewed notification overlay (deploy_image=true) or reuse the qualified image (false); sync/traffic/scheduler remain false."
        required: true
        type: boolean
        default: false
      notification_readback_only:
        description: "GET only the fixed failed notification candidate and original baseline; requires notification_only=true and all deployment controls=false."
        required: true
        type: boolean
        default: false
      target:
        description: "Deployment target to run. Use hk-verify for an isolated HK dry-run Cloud Run service."
        required: true
        type: choice
        default: configured
        options:
          - configured
          - hk-verify
      configured_service:
        description: "Exact inventory service_name required for configured target."
        required: false
        type: string
      runtime_switch_only:
        description: "Apply one existing target's enabled switch without changing other service or scheduler configuration."
        required: true
        type: boolean
        default: false
      initial_state_source_run_id:
        description: "Use one confirmed initial private state ledger from the original evidence run."
        required: false
        type: string
      initial_state_current_run_id:
        description: "One fresh read-only observation for the confirmed initial state."
        required: false
        type: string
      request_id:
        description: "Unique lowercase UUID for correlating a runtime switch request."
        required: false
        type: string
      source_commit:
        description: "Full commit SHA from this repository to build when dispatching an image deployment."
        required: false
        type: string
      expected_serving_revision_digest:
        description: "Fresh P-approved SHA256 of the exact currently serving revision name; binding preparation only."
        required: false
        type: string
      expected_full_target_digest:
        description: "Fresh P-approved SHA256 of the complete effective runtime target; binding preparation only."
        required: false
        type: string
      expected_service_spec_digest:
        description: "Fresh P-approved SHA256 of the full current Service spec; binding preparation only."
        required: false
        type: string
      cloud_run_region:
        description: "Cloud Run region for hk-verify. Leave blank to use repository/environment variables."
        required: false
        type: string
      cloud_run_service:
        description: "Cloud Run service for hk-verify."
        required: false
        type: string
        default: interactive-brokers-hk-verify-service
      account_group:
        description: "IBKR account-group selector for hk-verify."
        required: false
        type: string
        default: hk-verify
      account_group_config_secret_name:
        description: "Optional Secret Manager secret name for the IBKR account-group config."
        required: false
        type: string
      deploy_image:
        description: "Build and deploy the container image for hk-verify."
        required: true
        type: boolean
        default: true
      sync_env:
        description: "Sync hk-verify Cloud Run environment variables without shifting traffic or Scheduler state."
        required: true
        type: boolean
        default: true
      approve_traffic_shift:
        description: "Explicitly shift Cloud Run traffic to the candidate revision after no-traffic prep."
        required: true
        type: boolean
        default: false
      approve_scheduler_sync:
        description: "Explicitly create/update Cloud Scheduler jobs and apply pause/resume for the selected target."
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-cloud-run-env:
    name: Deploy / Sync Cloud Run
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/sync-cloud-run-env-protected.yml
    with:
      notification_marker_mode: ${{ inputs.notification_marker_mode }}
      approve_marker_probe: ${{ inputs.approve_marker_probe }}
      notification_only: ${{ inputs.notification_only }}
      notification_readback_only: ${{ inputs.notification_readback_only }}
      target: ${{ inputs.target }}
      configured_service: ${{ inputs.configured_service }}
      runtime_switch_only: ${{ inputs.runtime_switch_only }}
      initial_state_source_run_id: ${{ inputs.initial_state_source_run_id }}
      initial_state_current_run_id: ${{ inputs.initial_state_current_run_id }}
      request_id: ${{ inputs.request_id }}
      source_commit: ${{ inputs.source_commit }}
      expected_serving_revision_digest: ${{ inputs.expected_serving_revision_digest }}
      expected_full_target_digest: ${{ inputs.expected_full_target_digest }}
      expected_service_spec_digest: ${{ inputs.expected_service_spec_digest }}
      cloud_run_region: ${{ inputs.cloud_run_region }}
      cloud_run_service: ${{ inputs.cloud_run_service }}
      account_group: ${{ inputs.account_group }}
      account_group_config_secret_name: ${{ inputs.account_group_config_secret_name }}
      deploy_image: ${{ inputs.deploy_image }}
      sync_env: ${{ inputs.sync_env }}
      approve_traffic_shift: ${{ inputs.approve_traffic_shift }}
      approve_scheduler_sync: ${{ inputs.approve_scheduler_sync }}
    secrets:
      IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX: ${{ inputs.initial_state_source_run_id != '' && (vars.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX || secrets.IBKR_RECONCILIATION_RECOVERY_STATE_LEDGER_PREFIX) || '' }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICES: ${{ secrets.CLOUD_RUN_SERVICES }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_NOTIFICATION_MARKER_GCS_URI: ${{ secrets.IBKR_NOTIFICATION_MARKER_GCS_URI }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD: ${{ secrets.STRATEGY_PLUGIN_ALERT_EMAIL_SENDER_PASSWORD }}
      STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_PUSH_ACCESS_TOKEN }}
      STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_PUSH_APP_TOKEN }}
      STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN: ${{ secrets.STRATEGY_PLUGIN_ALERT_SMS_AUTH_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      DIGEST_TARGET_BINDINGS_JSON: ${{ secrets.DIGEST_TARGET_BINDINGS_JSON }}
      DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID }}
      DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID }}
      IBKR_DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.IBKR_DIGEST_OPAQUE_ACCOUNT_UID }}
      IBKR_DIGEST_TARGET_ID: ${{ secrets.IBKR_DIGEST_TARGET_ID }}

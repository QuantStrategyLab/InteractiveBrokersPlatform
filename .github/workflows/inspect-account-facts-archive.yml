name: Inspect Account Facts Archive

on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing protected account slot or live strategy profile; no publishing
        type: choice
        required: true
        options: [additional-1, additional-2, additional-3, global_etf_rotation, russell_top50_leader_rotation]
      archive_date:
        description: UTC report date (YYYY-MM-DD), within retention; today allowed for a profile
        type: string
        required: true
      scope:
        description: One report day, monthly filename metadata, or at most 64 original monthly reports
        type: choice
        default: day
        options: [day, month-metadata, month-snapshots]

permissions:
  contents: read
  id-token: write

concurrency:
  group: account-facts-archive
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/inspect-account-facts-archive-protected.yml
    with:
      target: ${{ inputs.target }}
      archive_date: ${{ inputs.archive_date }}
      scope: ${{ inputs.scope }}
    secrets:
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && (vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON) || '' }}
      ACCOUNT_FACTS_RECOVERY_WIF_PROVIDER: ${{ secrets.ACCOUNT_FACTS_RECOVERY_WIF_PROVIDER }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON || '' }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID || '' }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME || '' }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION || '' }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE || '' }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ (inputs.target == 'global_etf_rotation' || inputs.target == 'russell_top50_leader_rotation') && secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR || '' }}

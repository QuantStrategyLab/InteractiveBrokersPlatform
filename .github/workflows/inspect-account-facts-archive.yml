name: Inspect Account Facts Archive

on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing protected account slot to inspect; no publishing
        type: choice
        required: true
        options: [additional-1, additional-2, additional-3]
      archive_date:
        description: Original past UTC report date (YYYY-MM-DD), within retention
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: account-facts-archive
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IBKR_ACCOUNT_FACTS_TARGET: ${{ inputs.target }}
      IBKR_ACCOUNT_FACTS_ARCHIVE_DATE: ${{ inputs.archive_date }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IBKR_DEPLOY_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::IBKR_DEPLOY_SERVICE_ACCOUNT is required" >&2
            exit 2
          fi
      - uses: actions/checkout@v6
      - name: Authenticate with the existing archive read identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.ACCOUNT_FACTS_RECOVERY_WIF_PROVIDER }}
          service_account: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect one original report day without publishing
        run: python3 -m scripts.inspect_account_facts_archive

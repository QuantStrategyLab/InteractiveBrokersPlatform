name: Diagnose Account Facts Identity

on:
  workflow_dispatch:
    inputs:
      prepare_primary_recovery_secrets:
        description: Seal exactly two primary recovery Secret values with the supplied destination GitHub public keys; no configuration write
        type: boolean
        required: true
        default: false
      primary_recovery_public_keys:
        description: Exact existing IBKR repo and QRS environment GitHub public-key responses; encryption only
        type: string
        required: false
        default: ''
      backup_primary_source_state:
        description: Back up verified primary source state to existing private storage; no config change or sync
        type: boolean
        required: true
        default: false
      primary_backup_hashes:
        description: Exact target/configured/candidate SHA256 JSON from the authenticated primary comparison
        type: string
        required: false
        default: ''
      inspect_primary_backup_only:
        description: Read and verify existing primary backup objects only; never upload or retry
        type: boolean
        required: true
        default: false
      primary_backup_original_head_sha:
        description: Exact source SHA of the original uncertain backup run; inspection only
        type: string
        required: false
        default: ''
      primary_backup_reference_hashes:
        description: Optional exact failed object/reference SHA256 JSON; prove the protected destination without disclosing it
        type: string
        required: false
        default: ''
      serving_source_metadata_only:
        description: Read serving revision and deploy provenance only; no reports, image pull or business request
        type: boolean
        required: true
        default: false
      registry_source_metadata_only:
        description: Read exact serving digest registry provenance shape only; no reports, logs or image execution; exclusive with serving source mode
        type: boolean
        required: true
        default: false
      static_source_only:
        description: Compare eight public files with an exact source candidate in the serving digest; static OCI reads only, no image execution; exclusive with metadata modes
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read identity for ${{ matrix.target }}
    if: ${{ github.ref == 'refs/heads/main' && !(inputs.serving_source_metadata_only && inputs.registry_source_metadata_only) && !(inputs.static_source_only && (inputs.serving_source_metadata_only || inputs.registry_source_metadata_only)) && !(inputs.backup_primary_source_state && (inputs.serving_source_metadata_only || inputs.registry_source_metadata_only || inputs.static_source_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ inputs.backup_primary_source_state && fromJSON('["primary-live"]') || fromJSON('["primary-live","additional-1","additional-2","additional-3"]') }}
    env:
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_TARGET: ${{ matrix.target }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      # Existing platform region; not inferred from a report or a public example.
      CLOUD_RUN_REGION: us-central1
      IBKR_PRIMARY_BACKUP_HASHES: ${{ inputs.primary_backup_hashes }}
      IBKR_PRIMARY_BACKUP_ORIGINAL_HEAD_SHA: ${{ inputs.primary_backup_original_head_sha }}
      IBKR_PRIMARY_BACKUP_REFERENCE_HASHES: ${{ inputs.primary_backup_reference_hashes }}
      IBKR_PRIMARY_BACKUP_ENABLED: ${{ inputs.backup_primary_source_state }}
      IBKR_PRIMARY_BACKUP_INSPECT_ONLY: ${{ inputs.inspect_primary_backup_only }}
      IBKR_PRIMARY_RECOVERY_PUBLIC_KEYS: ${{ inputs.primary_recovery_public_keys }}
      IBKR_PRIMARY_RECOVERY_MODE: ${{ inputs.prepare_primary_recovery_secrets }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IBKR_PRIMARY_RECOVERY_MODE" = "true" ] && [ "$IBKR_PRIMARY_BACKUP_ENABLED" != "true" ]; then
            echo "status=blocked reason=recovery_requires_primary_backup_mode"
            exit 2
          fi
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject invalid slot or protected configuration without cloud reads
        if: ${{ !inputs.backup_primary_source_state }}
        run: python3 -m scripts.diagnose_account_facts_identity --preflight

      - name: Validate primary backup comparison before cloud authentication
        if: ${{ inputs.backup_primary_source_state }}
        run: |
          python3 -m scripts.backup_primary_account_facts_state --preflight
          if [ "$IBKR_PRIMARY_RECOVERY_MODE" = "true" ]; then
            python3 -m scripts.backup_primary_account_facts_state --recovery-preflight
          fi

      - name: Authenticate with the existing identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
          service_account: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up read-only cloud commands
        uses: google-github-actions/setup-gcloud@v3

      - name: Read report and service revision equality
        if: ${{ !inputs.backup_primary_source_state && !inputs.serving_source_metadata_only && !inputs.registry_source_metadata_only && !inputs.static_source_only }}
        run: python3 -m scripts.diagnose_account_facts_identity

      - name: Back up or inspect primary source state and verify exact private readback
        if: ${{ inputs.backup_primary_source_state }}
        run: |
          if [ "$IBKR_PRIMARY_RECOVERY_MODE" = "true" ]; then
            # Recovery-tool dependency only; no application/lockfile change.
            python3 -m pip install --disable-pip-version-check --quiet --target "$RUNNER_TEMP/primary-seal-python" PyNaCl==1.5.0
            PYTHONPATH="$RUNNER_TEMP/primary-seal-python:$GITHUB_WORKSPACE" python3 -m scripts.backup_primary_account_facts_state --prepare-recovery-secrets
          else
            python3 -m scripts.backup_primary_account_facts_state ${{ inputs.inspect_primary_backup_only && '--inspect-only' || '' }}
          fi

      - name: Preserve only the standard GitHub sealed recovery values
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: primary-recovery-sealed-secrets
          path: ${{ runner.temp }}/primary-recovery-secrets.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Read serving source metadata without reports or image execution
        if: ${{ inputs.serving_source_metadata_only && !inputs.registry_source_metadata_only && !inputs.static_source_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.diagnose_account_facts_identity --serving-source-metadata-only

      - name: Read registry provenance shape without reports or image execution
        if: ${{ inputs.registry_source_metadata_only && !inputs.serving_source_metadata_only && !inputs.static_source_only }}
        run: python3 -m scripts.diagnose_account_facts_identity --registry-source-metadata-only

      - name: Compare fixed public source files in the exact serving image
        if: ${{ inputs.static_source_only && !inputs.serving_source_metadata_only && !inputs.registry_source_metadata_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnose_image_static_source.py --static-source-only

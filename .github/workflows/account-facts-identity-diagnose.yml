name: Diagnose Account Facts Identity (read only)

on:
  workflow_dispatch:
    inputs:
      serving_source_metadata_only:
        description: Read serving revision and deploy provenance only; no reports, image pull or business request
        type: boolean
        required: true
        default: false
      registry_source_metadata_only:
        description: Read exact serving digest registry provenance shape only; no reports, logs or image execution; exclusive with serving source mode
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read identity for ${{ matrix.target }}
    if: ${{ github.ref == 'refs/heads/main' && !(inputs.serving_source_metadata_only && inputs.registry_source_metadata_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [primary-live, additional-1, additional-2, additional-3]
    env:
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_TARGET: ${{ matrix.target }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      # Existing platform region; not inferred from a report or a public example.
      CLOUD_RUN_REGION: us-central1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject invalid slot or protected configuration without cloud reads
        run: python3 scripts/diagnose_account_facts_identity.py --preflight

      - name: Authenticate with the existing identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
          service_account: ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com

      - name: Set up read-only cloud commands
        uses: google-github-actions/setup-gcloud@v3

      - name: Read report and service revision equality
        if: ${{ !inputs.serving_source_metadata_only && !inputs.registry_source_metadata_only }}
        run: python3 scripts/diagnose_account_facts_identity.py

      - name: Read serving source metadata without reports or image execution
        if: ${{ inputs.serving_source_metadata_only && !inputs.registry_source_metadata_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnose_account_facts_identity.py --serving-source-metadata-only

      - name: Read registry provenance shape without reports or image execution
        if: ${{ inputs.registry_source_metadata_only && !inputs.serving_source_metadata_only }}
        run: python3 scripts/diagnose_account_facts_identity.py --registry-source-metadata-only

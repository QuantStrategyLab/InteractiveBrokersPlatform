name: List Flex-related Secret Manager names

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ibkr-list-flex-secret-names
  cancel-in-progress: false

jobs:
  list:
    if: ${{ github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: interactivebrokersquant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: List matching secret names only
        run: |
          set -euo pipefail
          names="$(gcloud secrets list --project="$GCP_PROJECT_ID" --format='value(name)' \
            | awk -F/ '{print $NF}' \
            | grep -E -i 'flex|period.return|ibkr.flex' \
            | sort || true)"
          if [ -z "$names" ]; then
            echo "status=ok count=0 names="
          else
            count="$(printf '%s\n' "$names" | wc -l | tr -d ' ')"
            joined="$(printf '%s\n' "$names" | paste -sd, -)"
            echo "status=ok count=${count} names=${joined}"
          fi

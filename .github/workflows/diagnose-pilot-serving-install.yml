name: Read IBKR pilot serving install identity

on:
  workflow_dispatch:
    inputs:
      gateway_tcp_preflight:
        description: "With runner preflight, connect once to the original direct address/port and close; send no broker protocol."
        required: false
        default: false
        type: boolean
      configuration_reference_only:
        description: "Only attest the literal configuration Secret reference hash; never access its payload."
        required: false
        default: false
        type: boolean
      runner_gateway_preflight:
        description: "Read the original runner's Gateway configuration and static IAP permission; no broker protocol."
        required: false
        default: false
        type: boolean
      profile:
        description: "Read exactly one TQQQ serving image; no deployment."
        required: true
        type: choice
        options: [tqqq_growth_income]
      source_commit:
        description: "Exact current main SHA; its lockfile is comparison evidence only."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform'
    uses: ./.github/workflows/diagnose-pilot-serving-install-protected.yml
    with:
      profile: ${{ inputs.profile }}
      source_commit: ${{ inputs.source_commit }}
      runner_gateway_preflight: ${{ inputs.runner_gateway_preflight }}
      configuration_reference_only: ${{ inputs.configuration_reference_only }}
      gateway_tcp_preflight: ${{ inputs.gateway_tcp_preflight }}
    secrets:
      DEPLOY_GATE: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      GCP_ARTIFACT_REGISTRY_HOSTNAME: ${{ vars.GCP_ARTIFACT_REGISTRY_HOSTNAME }}
      IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS: ${{ vars.IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS }}

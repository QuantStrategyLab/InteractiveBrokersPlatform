name: Flex collection release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected release environment
        type: choice
        required: true
        options:
          - flex-release
          - flex-release-test
      operation:
        description: Release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
          - rollback
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    uses: QuantStrategyLab/.github/.github/workflows/deploy-job.yml@ec284d416698b3883a217b625b5ca1df8549b904
    with:
      provider: gcp
      environment: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
    secrets:
      DEPLOY_WIF_PROVIDER: ${{ secrets.DEPLOY_WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}
      DEPLOY_RESOURCE: ${{ secrets.DEPLOY_RESOURCE }}
      DEPLOY_PREVIOUS_IMAGE: ${{ secrets.DEPLOY_PREVIOUS_IMAGE }}
      DEPLOY_CANDIDATE_IMAGE: ${{ secrets.DEPLOY_CANDIDATE_IMAGE }}

name: Collect IBKR Reconciliation Evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Frozen live target to read; this workflow has no order path."
        required: true
        default: all
        type: choice
        options:
          - all
          - soxl_soxx_trend_income
          - tqqq_growth_income
          - global_etf_rotation
          - russell_top50_leader_rotation
      inspect_flex_runtime_binding_only:
        description: "Compare protected Flex account configuration with serving runtime metadata and optional existing receipt; no broker calls."
        required: false
        type: boolean
        default: false
      inspect_recovery_receipt_only:
        description: "Read and classify an existing trusted recovery receipt; no broker or state changes."
        required: false
        type: boolean
        default: false
      reconciliation_run_id:
        description: "Optional completed reconciliation run ID for one selected target; read existing artifacts only."
        required: false
        type: string
      inspect_execution_ledger:
        description: "Read only scoped execution-record types in the cloud runner; emit counts only."
        required: false
        type: boolean
        default: false
      initial_enrollment:
        description: "Include one target's initial facts only in the existing private report."
        required: false
        type: boolean
        default: false
      publish_initial_run_id:
        description: "Publish the private initial facts from one completed initial evidence run."
        required: false
        type: string
      verify_initial_source_run_id:
        description: "Original initial evidence run for confirmation verification."
        required: false
        type: string
      verify_initial_current_run_id:
        description: "New read-only initial evidence run after confirmation."
        required: false
        type: string
      archive_initial_state_ledger:
        description: "After confirmation and successful verification, create the existing private state ledger."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ibkr-reconciliation-evidence-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  collect-evidence:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/collect-reconciliation-evidence-protected.yml
    with:
      target: ${{ inputs.target }}
      reconciliation_run_id: ${{ inputs.reconciliation_run_id }}
      inspect_execution_ledger: ${{ inputs.inspect_execution_ledger }}
      inspect_flex_runtime_binding_only: ${{ inputs.inspect_flex_runtime_binding_only }}
      inspect_recovery_receipt_only: ${{ inputs.inspect_recovery_receipt_only }}
      initial_enrollment: ${{ inputs.initial_enrollment }}
      publish_initial_run_id: ${{ inputs.publish_initial_run_id }}
      verify_initial_source_run_id: ${{ inputs.verify_initial_source_run_id }}
      verify_initial_current_run_id: ${{ inputs.verify_initial_current_run_id }}
      archive_initial_state_ledger: ${{ inputs.archive_initial_state_ledger }}
    secrets:
      RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ inputs.publish_initial_run_id != '' && secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN || '' }}
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ inputs.verify_initial_source_run_id != '' && secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN || '' }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON || '' }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON || '' }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON || '' }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID || '' }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME || '' }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION || '' }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE || '' }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ (inputs.inspect_flex_runtime_binding_only || inputs.inspect_recovery_receipt_only || inputs.publish_initial_run_id != '' || inputs.verify_initial_source_run_id != '' || inputs.verify_initial_current_run_id != '') && secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR || '' }}

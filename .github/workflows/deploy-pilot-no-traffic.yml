name: Deploy IBKR pilot without traffic

on:
  workflow_dispatch:
    inputs:
      isolated_job_phase:
        description: "With temporary Job mode, test TCP or the frozen application's isolation. Neither runs a strategy cycle."
        type: choice
        required: false
        default: tcp
        options: [tcp, isolation]
      isolated_job_network_preflight:
        description: "Run one zero-retry Job on the original network/identity, then delete it. Phase selects TCP (60s) or application isolation (120s). Requires Job and billing authorization."
        type: boolean
        required: false
        default: false
      isolated_cleanup_run_id:
        description: "With isolated mode, only delete this prior run's proven unused probe; never deploy."
        type: string
        required: false
        default: ""
      isolated_network_preflight:
        description: "Temporarily test the original Cloud Run network with stdlib only, restore configuration and delete the probe revision. Requires deployment authorization."
        type: boolean
        required: false
        default: false
      profile:
        description: "Single pilot profile; never enables trading or shifts traffic."
        required: true
        type: choice
        options: [tqqq_growth_income]
      source_commit:
        description: "Exact reviewed 40-character repository commit for the protected helper."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Share the original deployment lock; this entry must not race ordinary deploys.
concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform'
    uses: ./.github/workflows/deploy-pilot-no-traffic-protected.yml
    with:
      profile: ${{ inputs.profile }}
      source_commit: ${{ inputs.source_commit }}
      isolated_job_phase: ${{ inputs.isolated_job_phase }}
      isolated_job_network_preflight: ${{ inputs.isolated_job_network_preflight }}
      isolated_network_preflight: ${{ inputs.isolated_network_preflight }}
      isolated_cleanup_run_id: ${{ inputs.isolated_cleanup_run_id }}
    secrets:
      DEPLOY_GATE: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      GCP_ARTIFACT_REGISTRY_HOSTNAME: ${{ vars.GCP_ARTIFACT_REGISTRY_HOSTNAME }}
      IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS: ${{ vars.IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS }}

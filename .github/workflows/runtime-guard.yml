name: Runtime Guard

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Cloud Logging lookback window in minutes."
        required: false
        type: string
        default: "180"
      require_success:
        description: "Alert if no successful Cloud Run request exists in the lookback window."
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      fail_workflow_on_alert:
        description: "Fail this workflow when an alert is emitted."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
  schedule:
    - cron: "19,49 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check Cloud Run runtime
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runtime-guard-protected.yml
    with:
      lookback_minutes: ${{ inputs.lookback_minutes }}
      require_success: ${{ inputs.require_success }}
      fail_workflow_on_alert: ${{ inputs.fail_workflow_on_alert }}
    secrets:
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICES: ${{ secrets.CLOUD_RUN_SERVICES }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      RUNTIME_GUARD_SCHEDULER_JOB_PATTERN: ${{ secrets.RUNTIME_GUARD_SCHEDULER_JOB_PATTERN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

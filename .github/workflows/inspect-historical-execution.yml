name: Inspect Historical IBKR Execution

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Configured live runtime target to inspect."
        required: true
        type: choice
        options:
          - tqqq_growth_income
          - soxl_soxx_trend_income
          - global_etf_rotation
          - russell_top50_leader_rotation
      dates:
        description: "Space-separated UTC dates (YYYY-MM-DD), maximum seven."
        required: true
        type: string
      inspect_execution_ledger:
        description: "Also read bounded execution claim/outcome counts without connecting to the broker."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/inspect-historical-execution-protected.yml
    with:
      target: ${{ inputs.target }}
      dates: ${{ inputs.dates }}
      inspect_execution_ledger: ${{ inputs.inspect_execution_ledger }}
    secrets:
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}

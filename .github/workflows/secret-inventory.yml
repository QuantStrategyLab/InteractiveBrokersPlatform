name: Secret metadata inventory

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          project_id: ${{ vars.SECRET_INVENTORY_PROJECT }}
          workload_identity_provider: ${{ vars.SECRET_INVENTORY_PROVIDER }}
          service_account: ${{ vars.SECRET_INVENTORY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
      - name: Read inventory and check permission boundaries
        env:
          INVENTORY_PROJECT: ${{ vars.SECRET_INVENTORY_PROJECT }}
          INVENTORY_PROJECT_NUMBER: ${{ vars.SECRET_INVENTORY_PROJECT_NUMBER }}
          INVENTORY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/secret_inventory.py

name: Check IBKR Flex Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}

jobs:
  check:
    if: ${{ github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require infrastructure variables
        env:
          QSL_CONSOLE_BASE_URL: ${{ vars.QSL_CONSOLE_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in QSL_CONSOLE_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout main source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Check configuration shape without fetching or publishing
        run: uv run --no-sync python -m scripts.publish_ibkr_flex_period_return --preflight
        env:
          GITHUB_SHA: ${{ github.sha }}
          IBKR_PERIOD_RETURN_TARGET_ID: ${{ secrets.IBKR_PERIOD_RETURN_TARGET_ID }}
          IBKR_PERIOD_RETURN_SOURCE_BINDING_ID: ${{ secrets.IBKR_PERIOD_RETURN_SOURCE_BINDING_ID }}
          IBKR_PERIOD_RETURN_ACCOUNT_SCOPE: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_SCOPE }}
          IBKR_PERIOD_RETURN_ACCOUNT_KEY: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_KEY }}
          IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON: ${{ secrets.IBKR_FLEX_EXPECTED_ACCOUNT_IDS_JSON }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.IBKR_ACCOUNT_FACTS_SYNC_TOKEN }}

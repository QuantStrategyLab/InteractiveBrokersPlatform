name: Read Primary TQQQ Account Facts

# Manual, single-account diagnosis. Job mode reads cash, API orders and metadata.
on:
  workflow_dispatch:
    inputs:
      daily_comparison_nonce:
        description: "Optional 64 lowercase hex nonce for the isolated website binding comparison."
        type: string
        required: false
        default: ""
      daily_comparison_slot:
        description: Existing account-facts slot for the isolated comparison
        type: choice
        required: false
        default: primary-live
        options: [primary-live, additional-1, additional-2, additional-3]
      maintenance_source_commit:
        description: "Optional exact 40-character source SHA for one zero-traffic /probe; empty reads existing reports only."
        type: string
        required: false
        default: ""
      maintenance_job:
        description: "Run one explicitly authorized temporary Job for cash, read-only API orders and TQQQ size metadata; no trading."
        type: boolean
        required: false
        default: false
      maintenance_job_readback:
        description: "Read only the already completed maintenance Job report; never execute another Job."
        type: boolean
        required: false
        default: false
      completed_summary_logs:
        description: "Read the fixed completed cash Job's existing logs and report; never connect to a broker or execute a Job."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: primary-account-facts-readonly
  cancel-in-progress: false

jobs:
  compare-website-binding:
    if: ${{ github.ref == 'refs/heads/main' && inputs.daily_comparison_nonce != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DAILY_COMPARISON_NONCE: ${{ inputs.daily_comparison_nonce }}
      IBKR_ACCOUNT_FACTS_TARGET: ${{ inputs.daily_comparison_slot || 'primary-live' }}
      IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
      IBKR_PERIOD_RETURN_ADDITIONAL_ACCOUNT_KEYS_JSON: ${{ secrets.IBKR_PERIOD_RETURN_ADDITIONAL_ACCOUNT_KEYS_JSON }}
      IBKR_PERIOD_RETURN_ADDITIONAL1_ACCOUNT_KEY: ${{ secrets.IBKR_PERIOD_RETURN_ADDITIONAL1_ACCOUNT_KEY }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      IBKR_PERIOD_RETURN_ACCOUNT_KEY: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_KEY }}
      IBKR_PERIOD_RETURN_ACCOUNT_SCOPE: ${{ secrets.IBKR_PERIOD_RETURN_ACCOUNT_SCOPE }}
      IBKR_PERIOD_RETURN_SOURCE_BINDING_ID: ${{ secrets.IBKR_PERIOD_RETURN_SOURCE_BINDING_ID }}
      IBKR_PERIOD_RETURN_TARGET_ID: ${{ secrets.IBKR_PERIOD_RETURN_TARGET_ID }}
    steps:
      - name: Validate isolated comparison inputs
        env:
          OTHER_MODES: ${{ inputs.maintenance_source_commit != '' || inputs.maintenance_job || inputs.maintenance_job_readback || inputs.completed_summary_logs }}
        run: |
          set -euo pipefail
          [[ "$OTHER_MODES" == "false" && "$DAILY_COMPARISON_NONCE" =~ ^[a-f0-9]{64}$ ]] || exit 1
      - uses: actions/checkout@v6
      - name: Compare the fixed primary binding without a report read
        run: python3 -m scripts.compare_website_daily_binding

  inspect:
    if: ${{ github.ref == 'refs/heads/main' && inputs.daily_comparison_nonce == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IBKR_ACCOUNT_FACTS_TARGET: primary-live
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      CLOUD_RUN_REGION: us-central1
      MAINTENANCE_SOURCE_COMMIT: ${{ inputs.maintenance_source_commit }}
      MAINTENANCE_JOB: ${{ inputs.maintenance_job }}
      MAINTENANCE_JOB_READBACK: ${{ inputs.maintenance_job_readback }}
      MAINTENANCE_COMPLETED_SUMMARY_LOGS: ${{ inputs.completed_summary_logs }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IBKR_DEPLOY_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::IBKR_DEPLOY_SERVICE_ACCOUNT is required" >&2
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify the existing primary scope before cloud authentication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath
          from urllib.parse import urlsplit
          from scripts.diagnose_account_facts_identity import resolve_expected

          expected = resolve_expected()
          parts = PurePosixPath(urlsplit(expected["expected_report_prefix"]).path).parts
          if "tqqq_growth_income" not in parts:
              raise SystemExit("status=blocked reason=primary_profile_mismatch")
          source = os.environ.get("MAINTENANCE_SOURCE_COMMIT", "")
          if os.environ.get("MAINTENANCE_COMPLETED_SUMMARY_LOGS") == "true" and (
              source or os.environ.get("MAINTENANCE_JOB") == "true" or os.environ.get("MAINTENANCE_JOB_READBACK") == "true"):
              raise SystemExit("status=blocked reason=summary_logs_modes_conflict")
          if source and (not re.fullmatch(r"[0-9a-f]{40}", source) or os.environ["GITHUB_RUN_ATTEMPT"] != "1"):
              raise SystemExit("status=blocked reason=candidate_source_invalid")
          if os.environ.get("MAINTENANCE_JOB") == "true" or os.environ.get("MAINTENANCE_JOB_READBACK") == "true":
              from scripts.observe_maintenance_cash_job import SOURCE
              if source != SOURCE:
                  raise SystemExit("status=blocked reason=job_source_invalid")
          if os.environ.get("MAINTENANCE_JOB") == os.environ.get("MAINTENANCE_JOB_READBACK") == "true":
              raise SystemExit("status=blocked reason=job_modes_conflict")
          print("status=preflight_verified scope=primary_tqqq")
          PY

      - name: Authenticate with the existing read identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
          service_account: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up existing read commands
        uses: google-github-actions/setup-gcloud@v3

      - name: Read the existing report and service identity without publishing
        if: inputs.maintenance_source_commit == '' && !inputs.completed_summary_logs
        run: python3 -m scripts.diagnose_account_facts_identity --broker-contract-source-evidence

      - name: Observe one zero-traffic maintenance cash snapshot without strategy execution
        if: inputs.maintenance_source_commit != '' && !inputs.maintenance_job && !inputs.maintenance_job_readback
        run: python3 -m scripts.observe_maintenance_cash

      - name: Observe one temporary maintenance cash Job without strategy execution
        if: inputs.maintenance_source_commit != '' && inputs.maintenance_job
        run: python3 -m scripts.observe_maintenance_cash_job

      - name: Read only the completed maintenance cash Job report
        if: inputs.maintenance_source_commit != '' && inputs.maintenance_job_readback
        run: python3 -m scripts.read_completed_maintenance_cash_job

      - name: Inspect only the fixed completed summary logs and report
        if: inputs.completed_summary_logs
        run: python3 -m scripts.read_completed_maintenance_cash_job --summary-logs

      - name: Retain only the value-free maintenance observation
        if: always() && (inputs.maintenance_source_commit != '' || inputs.completed_summary_logs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maintenance-cash-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-cash.safe.json
          if-no-files-found: warn
          retention-days: 30

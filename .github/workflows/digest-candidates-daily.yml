name: Digest Candidates Daily

# NOTIFY-04 B2: produce IBKR daily-digest candidate rows automatically after the
# US close, using the same read-only emit path as the manual
# execution-report-heartbeat `emit_digest_candidates` job (runtime report
# projection; no account-facts POST, no broker calls, no artifact).
#
# Dry-run by default: without vars.DIGEST_CANDIDATES_GCS_URI the JSON stays in
# runner temp and only a redacted summary is printed. With the variable set
# (owner-provisioned private bucket/prefix + objectCreator for the deploy SA),
# each target is uploaded to <uri>/ibkr/<business_day>/<target>.json for the
# QuantRuntimeSettings daily digest.
#
# Schedule: 21:15 UTC Mon–Fri = 05:15 Asia/Shanghai, before the 06:00 digest
# cut-off (the heartbeat workflow's 22:20 UTC cron is after it). Targets follow
# the same enable variables as the scheduled account-facts publisher.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "all-enabled = same targets as the schedule; or a single account-facts target"
        required: false
        type: choice
        default: all-enabled
        options:
          - all-enabled
          - primary-live
          - additional-1
          - additional-2
          - additional-3
  schedule:
    - cron: "15 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ibkr-digest-candidates-daily
  cancel-in-progress: false

jobs:
  candidates:
    name: Emit DIGEST_CANDIDATES (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.target == 'all-enabled') && format('["primary-live"{0}{1}]', vars.IBKR_ACCOUNT_FACTS_ADDITIONAL_DAILY_ENABLED == 'true' && ',"additional-1"' || '', vars.IBKR_ACCOUNT_FACTS_REMAINING_DAILY_ENABLED == 'true' && ',"additional-2","additional-3"' || '') || format('["{0}"]', inputs.target || 'primary-live')) }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      IBKR_ACCOUNT_FACTS_PROJECT_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ibkr-platform-deploy@interactivebrokersquant.iam.gserviceaccount.com
      IBKR_ACCOUNT_FACTS_TARGET: ${{ matrix.target }}
      IBKR_ACCOUNT_FACTS_REPORT_NAME: ''
      IBKR_ACCOUNT_FACTS_REPORT_PREFIX: ${{ secrets.IBKR_ACCOUNT_FACTS_REPORT_PREFIX }}
      IBKR_ACCOUNT_FACTS_TARGET_ID: ${{ secrets.IBKR_ACCOUNT_FACTS_TARGET_ID }}
      IBKR_ACCOUNT_FACTS_SERVICE_NAME: ${{ secrets.IBKR_ACCOUNT_FACTS_SERVICE_NAME }}
      IBKR_ACCOUNT_FACTS_RUNTIME_REVISION: ${{ secrets.IBKR_ACCOUNT_FACTS_RUNTIME_REVISION }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SCOPE }}
      IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ACCOUNT_SELECTOR_JSON }}
      IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR: ${{ secrets.IBKR_ACCOUNT_FACTS_DEPLOYMENT_SELECTOR }}
      IBKR_DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.IBKR_DIGEST_OPAQUE_ACCOUNT_UID }}
      IBKR_DIGEST_TARGET_ID: ${{ secrets.IBKR_DIGEST_TARGET_ID }}
      IBKR_DIGEST_ACCOUNT_HINT: ${{ secrets.IBKR_DIGEST_ACCOUNT_HINT }}
      IBKR_DIGEST_ACCOUNT_SCOPE: ${{ secrets.IBKR_DIGEST_ACCOUNT_SCOPE }}
      DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI || '' }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Select protected additional target before cloud authentication
        if: ${{ matrix.target == 'additional-1' || matrix.target == 'additional-2' || matrix.target == 'additional-3' }}
        env:
          IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON }}
        run: python3 scripts/configure_account_facts_target.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Emit DIGEST_CANDIDATES (ephemeral, no artifact)
        env:
          IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON: ${{ (matrix.target == 'additional-1' || matrix.target == 'additional-2' || matrix.target == 'additional-3') && secrets.IBKR_ACCOUNT_FACTS_ADDITIONAL_TARGETS_JSON || '' }}
          IBKR_DIGEST_CANDIDATES_OUTPUT_PATH: ${{ runner.temp }}/ibkr-digest-candidates.json
          IBKR_DIGEST_ACCOUNT_FACTS_OUTPUT_PATH: ${{ runner.temp }}/ibkr-digest-account-facts.json
        run: |
          # Writes only to runner temp. Do not upload-artifact by default (may contain account equity).
          # Equity: read-only project_ibkr_account_facts_history from runtime report (no POST).
          # Upload to the private store happens only in the next step when DIGEST_CANDIDATES_GCS_URI is set.
          uv run --no-sync python scripts/emit_digest_candidates.py
          test -f "$IBKR_DIGEST_CANDIDATES_OUTPUT_PATH"
          python3 -c 'import json,os; p=os.environ["IBKR_DIGEST_CANDIDATES_OUTPUT_PATH"]; d=json.load(open(p,encoding="utf-8")); r=d.get("runs") or []; print(json.dumps({"ephemeral_path_present":True,"schema_version":d.get("schema_version"),"producer_status":d.get("producer_status"),"runs":len(r),"fill_count_null":all(x.get("fill_count") is None for x in r),"equity_present":any(x.get("equity") is not None for x in r),"account_hint_present":any(bool(x.get("account_hint")) for x in r),"holdings_omitted":all("holdings" not in x for x in r)},sort_keys=True))'

      - name: Upload to private digest store (only when configured)
        env:
          CANDIDATES_PATH: ${{ runner.temp }}/ibkr-digest-candidates.json
          STORE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST_CANDIDATES_GCS_URI}" ]]; then
            echo "dry_run: vars.DIGEST_CANDIDATES_GCS_URI is unset; candidates stay in runner temp (not uploaded)."
            python3 scripts/digest_candidates_store.py summarize --path "$CANDIDATES_PATH"
            exit 0
          fi
          object="$(python3 scripts/digest_candidates_store.py object-uri --path "$CANDIDATES_PATH" --platform ibkr --target "$STORE_TARGET" --uri "$DIGEST_CANDIDATES_GCS_URI")"
          if [[ -z "$object" ]]; then
            echo "No single-day candidate rows; nothing uploaded."
            exit 0
          fi
          gcloud storage cp "$CANDIDATES_PATH" "$object" --no-user-output-enabled
          echo "Uploaded candidates for platform=ibkr target=${STORE_TARGET} (object path withheld from logs)."

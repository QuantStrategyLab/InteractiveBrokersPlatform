name: Capture IBKR pilot release source observation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Exactly one TQQQ serving source; no configuration change."
        required: true
        type: choice
        options: [tqqq_growth_income]
      source_commit:
        description: "Exact current main SHA of the reviewed capture code."
        required: true
        type: string
      operation:
        description: "Capture a new observation, or verify one exact earlier snapshot."
        required: true
        default: capture
        type: choice
        options: [capture, readback]
      capture_run_id:
        description: "Readback only: run ID from the earlier safe receipt."
        required: false
        type: string
      bundle_sha256:
        description: "Readback only: bundle digest from the earlier safe receipt."
        required: false
        type: string
      snapshot_sha256:
        description: "Readback only: full snapshot digest from the earlier safe receipt."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/InteractiveBrokersPlatform'
    uses: ./.github/workflows/capture-pilot-release-source-protected.yml
    with:
      profile: ${{ inputs.profile }}
      source_commit: ${{ inputs.source_commit }}
      operation: ${{ inputs.operation }}
      capture_run_id: ${{ inputs.capture_run_id }}
      bundle_sha256: ${{ inputs.bundle_sha256 }}
      snapshot_sha256: ${{ inputs.snapshot_sha256 }}
    secrets:
      DEPLOY_GATE: ${{ vars.ENABLE_GITHUB_CLOUD_RUN_DEPLOY }}
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ vars.CLOUD_RUN_SERVICE_TARGETS_JSON || secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      GCP_ARTIFACT_REGISTRY_HOSTNAME: ${{ vars.GCP_ARTIFACT_REGISTRY_HOSTNAME }}
      IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS: ${{ vars.IBKR_ARTIFACT_REGISTRY_ROLLBACK_DIGESTS }}

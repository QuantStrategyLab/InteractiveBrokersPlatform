name: PAPER Notification Preview

on:
  workflow_dispatch:
    inputs:
      send:
        description: Send the rendered preview message to Telegram (false prints the preview to the job log only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-notification-preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    name: Render PAPER notification preview (optional send)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      # Production runtime target stays fail-closed for this manual preview path.
      RUNTIME_TARGET_ENABLED: "false"
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      PREVIEW_SEND: ${{ inputs.send }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME }}
    steps:
      - name: Require infrastructure variables
        if: ${{ inputs.send == true }}
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Authenticate to Google Cloud for existing Telegram secret access
        if: ${{ inputs.send == true && env.TELEGRAM_TOKEN == '' && env.TELEGRAM_TOKEN_SECRET_NAME != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud for existing Telegram secret access
        if: ${{ inputs.send == true && env.TELEGRAM_TOKEN == '' && env.TELEGRAM_TOKEN_SECRET_NAME != '' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install locked runtime dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Render PAPER notification preview (sends only when requested)
        run: uv run --no-sync python scripts/send_paper_notification_preview.py

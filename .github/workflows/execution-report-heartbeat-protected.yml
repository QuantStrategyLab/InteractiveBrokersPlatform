name: Execution Report Heartbeat (protected execution)

# Register the original JSON as a workflow secret before any runner step header.
# This masks the passed value, not every extracted field or reserialized variant.
on:
  workflow_call:
    inputs:
      lookback_hours:
        type: string
        required: false
      notify_on_success:
        type: boolean
        required: false
      fail_workflow_on_alert:
        type: string
        required: false
      send_daily_dry_run_digest:
        type: boolean
        required: false
      account_facts_target:
        type: string
        required: false
      account_facts_report_name:
        type: string
        required: false
    secrets:
      IBKR_NOTIFICATION_MARKER_GCS_URI:
        required: false
      DIGEST_OPAQUE_ACCOUNT_UID:
        required: false
      DIGEST_TARGET_ID:
        required: false
      DIGEST_TARGET_BINDINGS_JSON:
        required: false
      DIGEST_CANDIDATES_GCS_URI:
        required: false
      CLOUD_RUN_SERVICE:
        required: false
      CLOUD_RUN_SERVICES:
        required: false
      CLOUD_RUN_SERVICE_TARGETS_JSON:
        required: false
      EXECUTION_EVIDENCE_SYNC_TOKEN:
        required: false
      GLOBAL_TELEGRAM_CHAT_ID:
        required: false
      RUNTIME_HEARTBEAT_REQUIRED_SERVICES:
        required: false
      RUNTIME_TARGET_JSON:
        required: false
      TELEGRAM_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  heartbeat:
    name: Check execution report heartbeat
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.account_facts_target != 'ingress-diagnostic' && inputs.account_facts_target != 'paused-refresh-preflight' && inputs.account_facts_target != 'paused-refresh-state-backup' && ((inputs.account_facts_target != 'primary-live' && inputs.account_facts_target != 'additional-1' && inputs.account_facts_target != 'additional-2' && inputs.account_facts_target != 'additional-3') || inputs.account_facts_report_name == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      IBKR_UNIFIED_NOTIFICATION_ENABLED: ${{ vars.IBKR_UNIFIED_NOTIFICATION_ENABLED || 'false' }}
      IBKR_NOTIFICATION_MARKER_GCS_URI: ${{ secrets.IBKR_NOTIFICATION_MARKER_GCS_URI }}
      DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI || secrets.DIGEST_CANDIDATES_GCS_URI }}
      DIGEST_STORE_TARGET: ${{ vars.DIGEST_STORE_TARGET }}
      DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID }}
      DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID }}
      DIGEST_TARGET_BINDINGS_JSON: ${{ secrets.DIGEST_TARGET_BINDINGS_JSON }}
      GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_HEARTBEAT_NAME: InteractiveBrokersPlatform
      RUNTIME_HEARTBEAT_REPORT_PLATFORM: interactive_brokers
      RUNTIME_HEARTBEAT_REQUIRED_SERVICES: ${{ secrets.RUNTIME_HEARTBEAT_REQUIRED_SERVICES }}
      RUNTIME_HEARTBEAT_GCS_URIS: ${{ vars.RUNTIME_HEARTBEAT_GCS_URIS || vars.EXECUTION_REPORT_GCS_URI }}
      RUNTIME_HEARTBEAT_LOOKBACK_HOURS: ${{ inputs.lookback_hours || vars.RUNTIME_HEARTBEAT_LOOKBACK_HOURS || '36' }}
      RUNTIME_HEARTBEAT_FAIL_WORKFLOW_ON_ALERT: ${{ inputs.fail_workflow_on_alert || vars.RUNTIME_HEARTBEAT_FAIL_WORKFLOW_ON_ALERT || 'true' }}
      RUNTIME_HEARTBEAT_ACCEPT_STATUSES: ${{ vars.RUNTIME_HEARTBEAT_ACCEPT_STATUSES }}
      RUNTIME_HEARTBEAT_REJECT_STATUSES: ${{ vars.RUNTIME_HEARTBEAT_REJECT_STATUSES }}
      RUNTIME_HEARTBEAT_MARKET_AWARE: ${{ vars.RUNTIME_HEARTBEAT_MARKET_AWARE || 'true' }}
      RUNTIME_HEARTBEAT_NOTIFY_ON_SUCCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_on_success && 'true' || 'false' }}
      RUNTIME_HEARTBEAT_MARKET_CALENDAR: ${{ vars.IBKR_MARKET_CALENDAR }}
      RUNTIME_HEARTBEAT_MARKET_TIMEZONE: ${{ vars.IBKR_MARKET_TIMEZONE }}
      RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES: ${{ vars.RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES || '30' }}
      RUNTIME_HEARTBEAT_SCHEDULER_AWARE: ${{ vars.RUNTIME_HEARTBEAT_SCHEDULER_AWARE || 'true' }}
      RUNTIME_HEARTBEAT_SCHEDULER_LOCATION: ${{ vars.RUNTIME_HEARTBEAT_SCHEDULER_LOCATION || vars.CLOUD_RUN_REGION || 'us-central1' }}
      RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
      RUNTIME_TARGET_JSON: ${{ secrets.RUNTIME_TARGET_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICES: ${{ secrets.CLOUD_RUN_SERVICES }}
      CLOUD_RUN_SERVICE_TARGETS_JSON: ${{ secrets.CLOUD_RUN_SERVICE_TARGETS_JSON }}
      CLOUD_SCHEDULER_MAIN_TIME: ${{ vars.CLOUD_SCHEDULER_MAIN_TIME }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME }}
    steps:
      - name: Require infrastructure variables
        env:
          IBKR_DEPLOY_SERVICE_ACCOUNT: ${{ vars.IBKR_DEPLOY_SERVICE_ACCOUNT }}
          IBKR_GCP_PROJECT_ID: ${{ vars.IBKR_GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBKR_DEPLOY_SERVICE_ACCOUNT IBKR_GCP_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required" >&2
              exit 2
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Authenticate to Google Cloud
        id: gcp_auth_primary
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Wait before Google Cloud authentication retry
        if: ${{ steps.gcp_auth_primary.outcome == 'failure' }}
        run: sleep 10

      - name: Retry Google Cloud authentication
        if: ${{ steps.gcp_auth_primary.outcome == 'failure' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Check recent execution report
        run: uv run --no-sync python scripts/execution_report_heartbeat.py

      - name: Publish read-only runtime execution evidence
        uses: QuantStrategyLab/QuantRuntimeSettings/actions/publish-runtime-execution-evidence@a50487eadc3b599f03f725a08a3c35d0da54d7b6
        with:
          source-id: runtime-reports-ibkr
          report-platform: interactive_brokers
          report-prefix: ${{ vars.RUNTIME_HEARTBEAT_GCS_URIS || vars.EXECUTION_REPORT_GCS_URI }}
          sync-url: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}

      - name: Send configured daily dry-run digest
        if: ${{ always() && (github.event_name == 'schedule' || inputs.send_daily_dry_run_digest) }}
        run: uv run --no-sync python scripts/daily_dry_run_digest.py

      - name: Publish existing reports as unified digest candidates
        if: ${{ !cancelled() && (vars.IBKR_UNIFIED_NOTIFICATION_ENABLED != '' || (success() && vars.QSL_ROUTINE_NOTIFICATION_MODE == 'daily_digest')) }}
        env:
          LEGACY_PRODUCER_ALLOWED: ${{ job.status == 'success' && 'true' || 'false' }}
          QSL_ROUTINE_NOTIFICATION_MODE: ${{ vars.QSL_ROUTINE_NOTIFICATION_MODE || 'immediate' }}
          RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
          RUNTIME_TARGET_JSON: ${{ secrets.RUNTIME_TARGET_JSON }}
          EXECUTION_REPORT_GCS_URI: ${{ vars.EXECUTION_REPORT_GCS_URI }}
          DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI || secrets.DIGEST_CANDIDATES_GCS_URI }}
          DIGEST_STORE_TARGET: ${{ vars.DIGEST_STORE_TARGET }}
          DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID }}
          DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID }}
          DIGEST_TARGET_BINDINGS_JSON: ${{ secrets.DIGEST_TARGET_BINDINGS_JSON }}
          DIGEST_NOTIFICATION_SCHEDULE_JSON: ${{ vars.DIGEST_NOTIFICATION_SCHEDULE_JSON }}
        run: |
          if uv run --no-sync python -c 'import os, sys; from notifications.unified_adapter import enabled; sys.exit(0 if enabled() or os.environ.get("LEGACY_PRODUCER_ALLOWED") == "true" else 1)'; then
            uv run --no-sync python scripts/emit_unified_digest_candidates.py
          fi
